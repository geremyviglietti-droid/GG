  <!-- OFFLINE SUBMIT ENGINE v8 -->
  <script>
    (function() {
      'use strict';
      var SUPABASE_URL = "https://couruebftrtlqwffdavz.supabase.co";
      var SUPABASE_KEY = "sb_publishable_XKVDlf9Bem837GPgx8RNqw_lgs9Q6zc";

      function openDB() {
        return new Promise(function(resolve, reject) {
          var req = indexedDB.open('adhesion-v8', 1);
          req.onupgradeneeded = function(e) { e.target.result.createObjectStore('queue', {keyPath:'id', autoIncrement:true}); };
          req.onsuccess = function() { resolve(req.result); };
          req.onerror = function() { reject(req.error); };
        });
      }

      function saveLocal(data) {
        return openDB().then(function(db) {
          return new Promise(function(resolve, reject) {
            var req = db.transaction('queue', 'readwrite').objectStore('queue').add({ data: data, savedAt: new Date().toISOString() });
            req.onsuccess = function() { resolve(req.result); };
            req.onerror = function() { reject(req.error); };
          });
        });
      }

      window.addEventListener('online', function() {
        openDB().then(function(db) {
          db.transaction('queue','readonly').objectStore('queue').getAll().onsuccess = function(e) {
            (e.target.result || []).forEach(function(item) {
              fetch(SUPABASE_URL + '/rest/v1/adherents', {
                method:'POST', headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Prefer':'return=representation'},
                body: JSON.stringify(item.data)
              }).then(function(r) { if(r.ok) openDB().then(function(db2){ db2.transaction('queue','readwrite').objectStore('queue').delete(item.id); }); }).catch(function(){});
            });
          };
        }).catch(function(){});
      });

      window.offlineSubmit = function(data, onSuccess, onOffline, onError) {
        var done = false;
        var timer = setTimeout(function() {
          if (!done) { done = true; saveLocal(data).then(function(id) { onOffline(id); }).catch(function(e) { onError(e.message); }); }
        }, 4000);
        fetch(SUPABASE_URL + '/rest/v1/adherents', {
          method:'POST', headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Prefer':'return=representation'},
          body: JSON.stringify(data)
        }).then(function(res) {
          if (done) return; clearTimeout(timer); done = true;
          if (res.ok) { res.json().then(onSuccess).catch(function(){ onSuccess([]); }); }
          else if (res.status===503||res.status===0||res.status===502) { saveLocal(data).then(function(id){ onOffline(id); }).catch(function(e){ onError(e.message); }); }
          else { res.text().then(function(txt){ onError('Erreur serveur ('+res.status+'): '+txt); }); }
        }).catch(function(err) {
          if (done) return; clearTimeout(timer); done = true;
          saveLocal(data).then(function(id){ onOffline(id); }).catch(function(e){ onError(e.message); });
        });
      };
    })();
  </script>

<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  const SUPABASE_URL  = "https://couruebftrtlqwffdavz.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_XKVDlf9Bem837GPgx8RNqw_lgs9Q6zc";
  const serif = "'Cormorant Garamond', serif";
  const font  = "'DM Sans', sans-serif";

  // ── CLIENT SUPABASE AUTH (officiel) ───────────────────────────────
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ── HELPERS (utilisent le token JWT de la session Auth) ───────────
  async function getAuthHeaders() {
    const { data: { session } } = await supabase.auth.getSession();
    const token = session?.access_token ?? SUPABASE_ANON_KEY;
    return {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${token}`,
    };
  }

  async function supabaseFetch(table, filter = "") {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 5000);
    try {
      const headers = await getAuthHeaders();
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=*${filter}&order=created_at.desc`, {
        headers,
        signal: controller.signal,
      });
      clearTimeout(timer);
      if (res.status === 503 || res.status === 0 || res.status === 502) throw new Error("offline");
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    } catch(e) {
      clearTimeout(timer);
      throw e;
    }
  }

  async function supabaseDelete(table, id) {
    const headers = await getAuthHeaders();
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
      method: "DELETE",
      headers,
    });
    if (!res.ok) throw new Error(await res.text());
  }

  async function supabaseUpdate(table, id, data) {
    const headers = await getAuthHeaders();
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json", ...headers, Prefer: "return=representation" },
      body: JSON.stringify(data),
    });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  async function supabaseInsert(table, data) {
    return new Promise((resolve, reject) => {
      window.offlineSubmit(
        data,
        (result) => resolve({ result, _offline: false }),
        (id)     => resolve({ result: null, _offline: true, _id: id }),
        (err)    => reject(new Error(err))
      );
    });
  }

  function calcAge(dateStr) {
    if (!dateStr) return null;
    const parts = String(dateStr).split(/[-\/]/);
    if (parts.length < 3) return null;
    const bYear = parseInt(parts[0]), bMonth = parseInt(parts[1]) - 1, bDay = parseInt(parts[2]);
    if (isNaN(bYear) || isNaN(bMonth) || isNaN(bDay)) return null;
    const n = new Date();
    let age = n.getFullYear() - bYear;
    if (n.getMonth() < bMonth || (n.getMonth() === bMonth && n.getDate() < bDay)) age--;
    return (age >= 0 && age < 120) ? age : null;
  }

  // ── IBAN ──────────────────────────────────────────────────────────
  const IBAN_LENGTHS = { FR:27,DE:22,BE:16,ES:24,IT:27,CH:21,GB:22,NL:18,PT:25,LU:20,AT:20,SE:24 };
  function validateIBAN(iban) {
    const c = iban.replace(/\s/g,"").toUpperCase();
    if (c.length < 15 || c.length > 34) return false;
    if (IBAN_LENGTHS[c.slice(0,2)] && c.length !== IBAN_LENGTHS[c.slice(0,2)]) return false;
    const r = (c.slice(4)+c.slice(0,4)).split("").map(x=>isNaN(x)?(x.charCodeAt(0)-55).toString():x).join("");
    let rem = 0; for (let i=0;i<r.length;i++) rem=(rem*10+parseInt(r[i]))%97;
    return rem===1;
  }
  function isIBANComplete(iban) {
    const c = iban.replace(/\s/g,"").toUpperCase();
    return IBAN_LENGTHS[c.slice(0,2)] ? c.length===IBAN_LENGTHS[c.slice(0,2)] : c.length>=15;
  }

  // ── PIE CHART ─────────────────────────────────────────────────────
  function PieChart({ data, size = 160 }) {
    const [hovered, setHovered] = React.useState(null);
    const total = data.reduce((s, d) => s + d.value, 0);
    if (total === 0) return <div style={{textAlign:"center",color:"rgba(255,255,255,0.3)",fontSize:12,padding:20}}>Pas encore de données</div>;
    let cumAngle = -Math.PI / 2;
    const cx = size / 2, cy = size / 2, r = size / 2 - 8;
    const slices = data.map(d => {
      const angle = (d.value / total) * 2 * Math.PI;
      const x1 = cx + r * Math.cos(cumAngle);
      const y1 = cy + r * Math.sin(cumAngle);
      cumAngle += angle;
      const x2 = cx + r * Math.cos(cumAngle);
      const y2 = cy + r * Math.sin(cumAngle);
      const large = angle > Math.PI ? 1 : 0;
      const midAngle = cumAngle - angle / 2;
      return { ...d, x1, y1, x2, y2, large, midAngle, pct: Math.round(d.value / total * 100) };
    }).filter(s => s.value > 0);
    return (
      <div className="pie-wrap" style={{display:"flex",alignItems:"center",gap:20,flexWrap:"wrap"}}>
        <svg width={size} height={size} style={{flexShrink:0}}>
          {slices.map((s, i) => (
            <path key={i}
              d={`M${cx},${cy} L${s.x1},${s.y1} A${r},${r} 0 ${s.large},1 ${s.x2},${s.y2} Z`}
              fill={s.color}
              opacity={hovered === null || hovered === i ? 1 : 0.4}
              stroke="rgba(15,14,26,0.6)" strokeWidth={2}
              style={{cursor:"pointer",transition:"opacity .2s"}}
              onMouseEnter={() => setHovered(i)}
              onMouseLeave={() => setHovered(null)}
              onClick={() => setHovered(hovered === i ? null : i)}
            />
          ))}
          {hovered !== null && slices[hovered] && (
            <text x={cx} y={cy-6} textAnchor="middle" fill="white" fontSize={13} fontWeight="700">{slices[hovered].pct}%</text>
          )}
          {hovered !== null && slices[hovered] && (
            <text x={cx} y={cy+10} textAnchor="middle" fill="rgba(255,255,255,0.6)" fontSize={9}>{slices[hovered].label}</text>
          )}
          {hovered === null && (
            <text x={cx} y={cy+5} textAnchor="middle" fill="rgba(255,255,255,0.3)" fontSize={10}>{total} adh.</text>
          )}
        </svg>
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          {slices.map((s, i) => (
            <div key={i} style={{display:"flex",alignItems:"center",gap:7,opacity:hovered===null||hovered===i?1:0.4,transition:"opacity .2s",cursor:"pointer"}}
              onMouseEnter={() => setHovered(i)} onMouseLeave={() => setHovered(null)} onClick={() => setHovered(hovered===i?null:i)}>
              <div style={{width:10,height:10,borderRadius:3,background:s.color,flexShrink:0}}/>
              <span style={{fontSize:11,color:"rgba(255,255,255,0.6)"}}>{s.label}</span>
              <span style={{fontSize:11,fontWeight:700,color:"white",marginLeft:"auto",paddingLeft:8}}>{s.value}</span>
            </div>
          ))}
        </div>
      </div>
    );
  }

  // ── BAR CHART ─────────────────────────────────────────────────────
  function BarChart({ data }) {
    const max = Math.max(...data.map(d => d.value), 1);
    const hasData = data.some(d => d.value > 0);
    if (!hasData) return <div style={{textAlign:"center",color:"rgba(255,255,255,0.3)",fontSize:12,padding:20}}>Pas encore de données</div>;
    return (
      <div className="bar-chart-wrap">
        {data.map((d, i) => (
          <div key={i} className="bar-row">
            <span className="bar-label">{d.label}</span>
            <div className="bar-track">
              <div className="bar-fill" style={{width:`${(d.value/max)*100}%`, background:d.color, opacity:d.value===0?0.15:1}}>
                {d.value > 0 && <span>{d.value}</span>}
              </div>
            </div>
            <span className="bar-count">{d.value}</span>
          </div>
        ))}
      </div>
    );
  }

  // ── LOGIN SCREEN ──────────────────────────────────────────────────
  function LoginScreen({ onLogin }) {

      if (!email.trim() || !password) { setError("Veuillez remplir tous les champs."); return; }
      setLoading(true); setError(null);
      try {
        // ✅ Supabase Auth — gère tokens JWT, sessions et refresh automatiquement
        const { data, error: authError } = await supabase.auth.signInWithPassword({
          email: email.trim(),
          password,
        });
        if (authError) {
          setError("Email ou mot de passe incorrect.");
        } else {
          // Récupérer le profil collecteur associé à cet utilisateur Auth
          const { data: profil } = await supabase
            .from("collecteurs")
            .select("*")
            .eq("auth_user_id", data.user.id)
            .single();
          const user = profil ?? { id: data.user.id, email: data.user.email, prenom: data.user.user_metadata?.prenom ?? "Collecteur", nom: data.user.user_metadata?.nom ?? "" };

    }

    async function handleResetPassword() {
      if (!email.trim()) { setError("Entrez votre email pour réinitialiser le mot de passe."); return; }
      setLoading(true); setError(null);
      const { error: resetError } = await supabase.auth.resetPasswordForEmail(email.trim(), {

      setLoading(false);

    const inp = (err) => ({

      fontSize: 15, fontFamily: font, background: "rgba(255,255,255,0.05)",

    });
    const lbl = { fontSize:11, fontWeight:700, color:"rgba(255,255,255,0.4)", display:"block", marginBottom:7, letterSpacing:".08em", textTransform:"uppercase" };

    return (
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"radial-gradient(ellipse at 60% 30%, rgba(76,29,149,.25), transparent 60%), #0f0e1a",padding:24}}>

            <p style={{color:"rgba(255,255,255,0.4)",fontSize:14}}>{resetMode ? "Réinitialisez votre mot de passe" : "Connectez-vous pour accéder à votre tableau de bord"}</p>
          </div>

          {resetSent ? (
            <div style={{background:"rgba(34,197,94,.12)",border:"1px solid rgba(34,197,94,.3)",borderRadius:14,padding:"20px 24px",textAlign:"center"}}>
              <div style={{fontSize:28,marginBottom:12}}>📧</div>
              <p style={{color:"#4ade80",fontWeight:700,fontSize:15,marginBottom:6}}>Email envoyé !</p>
              <p style={{color:"rgba(255,255,255,0.5)",fontSize:13,lineHeight:1.6}}>Consultez votre boîte mail pour réinitialiser votre mot de passe.</p>
              <button onClick={()=>{setResetMode(false);setResetSent(false);}} style={{marginTop:20,background:"none",border:"none",color:"#a78bfa",cursor:"pointer",fontSize:13,fontWeight:600}}>← Retour à la connexion</button>
            </div>
          ) : (
            <>
              <div style={{marginBottom:16}}>
                <label style={lbl}>Adresse email</label>
                <input type="email" value={email} onChange={e=>{setEmail(e.target.value);setError(null);}} onKeyDown={e=>e.key==="Enter"&&(resetMode?handleResetPassword():handleLogin())} placeholder="jean.martin@email.com" style={inp(!!error)} />
              </div>
              {!resetMode && (
                <div style={{marginBottom:24}}>
                  <label style={lbl}>Mot de passe</label>
                  <div style={{position:"relative"}}>
                    <input type={showPwd?"text":"password"} value={password} onChange={e=>{setPassword(e.target.value);setError(null);}} onKeyDown={e=>e.key==="Enter"&&handleLogin()} placeholder="••••••••" style={{...inp(!!error),paddingRight:48}} />
                    <button onClick={()=>setShowPwd(v=>!v)} style={{position:"absolute",right:14,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:"rgba(255,255,255,0.4)",fontSize:16}}>{showPwd?"🙈":"👁"}</button>
                  </div>
                </div>
              )}
              {error && <div style={{background:"rgba(239,68,68,.12)",border:"1px solid rgba(239,68,68,.3)",borderRadius:10,padding:"12px 16px",marginBottom:16,color:"#f87171",fontSize:13,textAlign:"center"}}>{error}</div>}
              <button onClick={resetMode?handleResetPassword:handleLogin} disabled={loading} style={{width:"100%",padding:"15px",borderRadius:14,border:"none",background:loading?"rgba(255,255,255,0.1)":"linear-gradient(135deg,#4c1d95,#6d28d9)",color:loading?"rgba(255,255,255,0.4)":"white",fontSize:15,fontWeight:700,cursor:loading?"not-allowed":"pointer",fontFamily:font,boxShadow:loading?"none":"0 8px 28px rgba(76,29,149,.45)",transition:"all .2s"}}>
                {loading ? "…" : resetMode ? "Envoyer le lien →" : "Se connecter →"}
              </button>
              <div style={{textAlign:"center",marginTop:16}}>
                <button onClick={()=>{setResetMode(v=>!v);setError(null);}} style={{background:"none",border:"none",color:"rgba(255,255,255,0.35)",cursor:"pointer",fontSize:13}}>
                  {resetMode ? "← Retour à la connexion" : "Mot de passe oublié ?"}
                </button>
              </div>
              <p style={{textAlign:"center",fontSize:13,color:"rgba(255,255,255,0.35)",marginTop:12}}>
                Pas encore de compte ? <a href="register.html" style={{color:"#a78bfa",textDecoration:"none",fontWeight:600}}>S'inscrire</a>
              </p>
            </>
          )}
        </div>
      </div>
    );
  }

  // ── DONATION PANEL ────────────────────────────────────────────────
  function DonationPanel({ currentUser, onSuccess }) {
    const [step, setStep]             = useState(0);
    const [form, setForm]             = useState({ nom:"", prenom:"", sexe:"", dateNaissance:"", adresse:"", codePostal:"", ville:"", telephone:"", email:"", consentRgpd:false, consentMarketing:false, montantDon:"", iban:"", bic:"", ibanValid:null, rdvDate:"", rdvHeure:"", rdvNote:"", ibanDiffere:false });
    const [errors, setErrors]         = useState({});
    const [submitting, setSubmitting] = useState(false);
    const [submitError, setSubmitError] = useState(null);
    const [done, setDone]             = useState(false);
    const [villeSuggestions, setVilleSuggestions] = useState([]);
    const [loadingVille, setLoadingVille] = useState(false);
    const canvasRef = useRef(null);
    const lastPos   = useRef(null);
    const [drawing, setDrawing]       = useState(false);
    const [signature, setSignature]   = useState(null);
    const cpTimerRef = useRef(null);

    const steps = ["Coordonnées","RGPD","Don","IBAN","Récap & Signature"];
    const montant = parseFloat(form.montantDon) || 0;
    const defiscalisation = (montant * 0.66).toFixed(2);
    const netDon = (montant * 0.34).toFixed(2);

    // Auto-lookup city from postal code (French API)
    async function lookupVille(cp) {
      if (cp.length < 5) { setVilleSuggestions([]); return; }
      setLoadingVille(true);
      try {
        const res = await fetch(`https://geo.api.gouv.fr/communes?codePostal=${cp}&fields=nom,codesPostaux&limit=8`);
        const data = await res.json();
        setVilleSuggestions(data.map(c => c.nom));
        if (data.length === 1) {
          setForm(f => ({...f, ville: data[0].nom}));
          setErrors(e => ({...e, ville: undefined}));
          setVilleSuggestions([]);
        }
      } catch(e) { setVilleSuggestions([]); }
      setLoadingVille(false);
    }

    function formatPhone(raw) {
      const digits = raw.replace(/\D/g, "").slice(0, 10);
      return digits.replace(/(\d{2})(?=\d)/g, "$1 ").trim();
    }

    // Format IBAN: groups of 4 chars
    function formatIBAN(raw) {
      const clean = raw.replace(/\s/g, "").toUpperCase();
      return clean.replace(/(.{4})(?=.)/g, "$1 ").trim();
    }

    function update(k, v) {
      setForm(f => {
        const n = {...f, [k]:v};
        if (k === "iban") {
          n[k] = formatIBAN(v);
          n.ibanValid = isIBANComplete(n[k]) ? validateIBAN(n[k]) : null;
        }
        if (k === "telephone") n[k] = formatPhone(v);
        return n;
      });
      setErrors(e => ({...e, [k]:undefined}));
      if (k === "codePostal") {
        clearTimeout(cpTimerRef.current);
        if (v.length >= 5) {
          cpTimerRef.current = setTimeout(() => lookupVille(v), 300);
        } else {
          setVilleSuggestions([]);
        }
      }
    }

    const inputS = (err, ok) => ({ border:`2px solid ${err?"#f87171":ok?"#22c55e":"#e2e8f0"}`, borderRadius:14, padding:"13px 16px", width:"100%", outline:"none", fontSize:14, fontFamily:font, background:err?"#fff5f5":ok?"#f0fdf4":"white", color:"#1a1a2e", boxSizing:"border-box" });
    const lbl = { fontSize:11, fontWeight:700, color:"#6b7280", display:"block", marginBottom:6, letterSpacing:".08em", textTransform:"uppercase" };

    function posFromEvent(e, canvas) {
      const r = canvas.getBoundingClientRect();
      const src = e.touches ? e.touches[0] : e;
      return { x:(src.clientX-r.left)*(canvas.width/r.width), y:(src.clientY-r.top)*(canvas.height/r.height) };
    }
    function startDraw(e) { e.preventDefault(); lastPos.current = posFromEvent(e, canvasRef.current); setDrawing(true); }
    function draw(e) {
      if (!drawing) return; e.preventDefault();
      const ctx = canvasRef.current.getContext("2d");
      const p = posFromEvent(e, canvasRef.current);
      ctx.beginPath(); ctx.strokeStyle="#1a1a2e"; ctx.lineWidth=2.5; ctx.lineCap="round"; ctx.lineJoin="round";
      ctx.moveTo(lastPos.current.x, lastPos.current.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      lastPos.current = p;
    }
    function endDraw(e) { e.preventDefault(); setDrawing(false); setSignature(canvasRef.current.toDataURL()); }
    function clearSignature() {
      const ctx = canvasRef.current.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvasRef.current.width, canvasRef.current.height);
      setSignature(null);
    }
    function initCanvas() {
      if (!canvasRef.current) return;
      const ctx = canvasRef.current.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvasRef.current.width, canvasRef.current.height);
    }
    React.useEffect(() => { if (step === 4) setTimeout(initCanvas, 50); }, [step]);

    function validate() {
      const e = {};
      if (step===0) {
        if (!form.nom.trim())    e.nom = "Requis";
        if (!form.prenom.trim()) e.prenom = "Requis";
        if (!form.dateNaissance) e.dateNaissance = "Requis";
        if (!form.adresse.trim()) e.adresse = "Requis";
        if (!form.codePostal.trim()) e.codePostal = "Requis";
        if (!form.ville.trim())  e.ville = "Requis";
        if (!form.telephone.trim()) e.telephone = "Requis";
        if (!form.email.trim() || !form.email.includes("@")) e.email = "Email invalide";
      }
      if (step===1 && !form.consentRgpd) e.consentRgpd = "Obligatoire";
      if (step===2) {
        const m = parseFloat(form.montantDon);
        if (!form.montantDon || isNaN(m)) e.montantDon = "Requis";
        else if (m < 10) e.montantDon = "Minimum 10 €";
      }
      if (step===3) {
        if (!form.ibanDiffere) {
          if (!form.iban.trim()) e.iban = "Requis";
          else if (form.ibanValid === false) e.iban = "IBAN invalide";
          else if (form.ibanValid === null)  e.iban = "IBAN incomplet";
        } else {
          if (!form.rdvDate) e.rdvDate = "Veuillez choisir une date de rappel";
          if (!form.rdvHeure) e.rdvHeure = "Veuillez choisir une heure";
        }
      }
      setErrors(e);
      return Object.keys(e).length === 0;
    }

    function next() { if (validate()) setStep(s => s+1); }
    function prev() { setStep(s => s-1); }

    async function handleSubmit() {
      if (!signature) { alert("Veuillez signer avant de valider."); return; }
      setSubmitting(true); setSubmitError(null);

      const data = {
        nom: form.nom, prenom: form.prenom, sexe: form.sexe || null, date_naissance: form.dateNaissance,
        adresse: form.adresse, code_postal: form.codePostal, ville: form.ville,
        telephone: form.telephone, email: form.email,
        consent_rgpd: form.consentRgpd, consent_marketing: form.consentMarketing,
        montant_don: form.montantDon ? parseFloat(form.montantDon) : null,
        reduction_fiscale: form.montantDon ? parseFloat(defiscalisation) : null,
        cout_net: form.montantDon ? parseFloat(netDon) : null,
        iban: form.ibanDiffere ? null : form.iban,
        bic: form.ibanDiffere ? null : form.bic,
        signature,
        collecteur_id: currentUser?.id,
        incomplet: form.ibanDiffere ? true : false,
        rdv_date: form.ibanDiffere && form.rdvDate ? `${form.rdvDate}T${form.rdvHeure||"10:00"}` : null,
        rdv_note: form.ibanDiffere ? form.rdvNote : null,
      };

      window.offlineSubmit(
        data,
        // Succès en ligne
        (result) => {
          setSubmitting(false);
          setDone(true);
          setTimeout(() => {
            onSuccess && onSuccess();
            setDone(false); setStep(0);
            setForm({ nom:"", prenom:"", sexe:"", dateNaissance:"", adresse:"", codePostal:"", ville:"", telephone:"", email:"", consentRgpd:false, consentMarketing:false, montantDon:"", iban:"", bic:"", ibanValid:null, rdvDate:"", rdvHeure:"", rdvNote:"", ibanDiffere:false });
            setSignature(null);
          }, 2000);
        },
        // Sauvegardé hors-ligne
        (id) => {
          setSubmitting(false);
          setDone(true);
          setSubmitError("📵 Dossier sauvegardé localement — synchronisation automatique au retour de la connexion.");
          setTimeout(() => {
            onSuccess && onSuccess();
            setDone(false); setStep(0);
            setForm({ nom:"", prenom:"", sexe:"", dateNaissance:"", adresse:"", codePostal:"", ville:"", telephone:"", email:"", consentRgpd:false, consentMarketing:false, montantDon:"", iban:"", bic:"", ibanValid:null, rdvDate:"", rdvHeure:"", rdvNote:"", ibanDiffere:false });
            setSignature(null);
          }, 3000);
        },
        // Erreur réelle
        (err) => {
          setSubmitting(false);
          setSubmitError("Erreur : " + err);
        }
      );
    }

    if (done) return (
      <div style={{textAlign:"center",padding:"60px 0"}}>
        <div style={{width:64,height:64,borderRadius:"50%",background:"#dcfce7",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",fontSize:28,color:"#16a34a"}}>✓</div>
        <h3 style={{fontFamily:serif,fontSize:26,color:"#1a1a2e",marginBottom:8}}>Dossier enregistré !</h3>
        <p style={{color:"#6b7280",fontSize:14}}>Retour au tableau de bord…</p>
      </div>
    );

    return (
      <div>
        {/* Barre de progression */}
        <div style={{display:"flex",gap:4,marginBottom:24}}>
          {steps.map((s,i) => (
            <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
              <div style={{width:32,height:32,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,background:i<step?"#22c55e":i===step?"#6d28d9":"#e5e7eb",color:i<=step?"white":"#9ca3af"}}>{i<step?"✓":i+1}</div>
              <span className="step-label" style={{fontSize:9,color:i===step?"#6d28d9":"#9ca3af",fontWeight:700,textTransform:"uppercase",letterSpacing:".06em",textAlign:"center"}}>{s}</span>
            </div>
          ))}
        </div>

        {/* Étape 0 */}
        {step===0 && (
          <div>
            <div className="form-grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}}>
              <div><label style={lbl}>Nom</label><input style={inputS(!!errors.nom)} value={form.nom} onChange={e=>update("nom",e.target.value)} placeholder="MARTIN"/>{errors.nom&&<p style={{color:"#ef4444",fontSize:12,marginTop:4}}>{errors.nom}</p>}</div>
              <div><label style={lbl}>Prénom</label><input style={inputS(!!errors.prenom)} value={form.prenom} onChange={e=>update("prenom",e.target.value)} placeholder="Jean"/>{errors.prenom&&<p style={{color:"#ef4444",fontSize:12,marginTop:4}}>{errors.prenom}</p>}</div>
            </div>

            {/* Sélecteur genre */}
            <div style={{marginBottom:16}}>
              <label style={lbl}>Genre <span style={{fontWeight:300,opacity:.5}}>(optionnel)</span></label>
              <div style={{display:"flex",gap:10}}>
                {[
                  {val:"M", label:"♂ Masculin",  bg:"#eff6ff", border:"#3b82f6", text:"#1d4ed8", activeBg:"#dbeafe"},
                  {val:"F", label:"♀ Féminin",   bg:"#fdf2f8", border:"#ec4899", text:"#be185d", activeBg:"#fce7f3"},
                  {val:"A", label:"⚧ Autre",      bg:"#f9fafb", border:"#9ca3af", text:"#6b7280", activeBg:"#f3f4f6"},
                ].map(opt => (
                  <div
                    key={opt.val}
                    onClick={()=>update("sexe", form.sexe===opt.val ? "" : opt.val)}
                    style={{
                      flex:1, padding:"10px 8px", borderRadius:12, cursor:"pointer", textAlign:"center",
                      border:`2px solid ${form.sexe===opt.val ? opt.border : "#e5e7eb"}`,
                      background: form.sexe===opt.val ? opt.activeBg : "white",
                      transition:"all .15s"
                    }}
                  >
                    <p style={{fontSize:13,fontWeight:700,color:form.sexe===opt.val?opt.text:"#6b7280"}}>{opt.label}</p>
                  </div>
                ))}
              </div>
            </div>

            <div style={{marginBottom:16}}><label style={lbl}>Date de naissance</label><input type="date" style={inputS(!!errors.dateNaissance)} value={form.dateNaissance} onChange={e=>update("dateNaissance",e.target.value)}/>{errors.dateNaissance&&<p style={{color:"#ef4444",fontSize:12,marginTop:4}}>{errors.dateNaissance}</p>}</div>
            <div style={{marginBottom:16}}><label style={lbl}>Adresse</label><input style={inputS(!!errors.adresse)} value={form.adresse} onChange={e=>update("adresse",e.target.value)} placeholder="12 rue de la Paix"/>{errors.adresse&&<p style={{color:"#ef4444",fontSize:12,marginTop:4}}>{errors.adresse}</p>}</div>
            <div className="form-grid-cp" style={{display:"grid",gridTemplateColumns:"160px 1fr",gap:16,marginBottom:16}}>
              <div>
                <label style={lbl}>Code postal</label>
                <input style={inputS(!!errors.codePostal)} value={form.codePostal} onChange={e=>update("codePostal",e.target.value)} placeholder="75001" maxLength={5} inputMode="numeric"/>
                {loadingVille && <p style={{fontSize:11,color:"#9ca3af",marginTop:4}}>Recherche…</p>}
                {errors.codePostal&&<p style={{color:"#ef4444",fontSize:12,marginTop:4}}>{errors.codePostal}</p>}
              </div>
              <div>
                <label style={lbl}>Ville</label>
                <div style={{position:"relative"}}>
                  <input style={inputS(!!errors.ville)} value={form.ville} onChange={e=>update("ville",e.target.value)} placeholder="Paris"/>
                  {villeSuggestions.length > 0 && (
                    <div className="ville-dropdown">
                      {villeSuggestions.map((v,i) => (
                        <div key={i} className="ville-dropdown-item" onMouseDown={()=>{ setForm(f=>({...f,ville:v})); setVilleSuggestions([]); setErrors(e=>({...e,ville:undefined})); }}>{v}</div>
                      ))}
                    </div>
                  )}
                </div>
                {errors.ville&&<p style={{color:"#ef4444",fontSize:12,marginTop:4}}>{errors.ville}</p>}
              </div>
            </div>
            <div className="form-grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
              <div>
                <label style={lbl}>Téléphone</label>
                <input type="tel" inputMode="numeric" style={inputS(!!errors.telephone)} value={form.telephone} onChange={e=>update("telephone",e.target.value)} placeholder="06 12 34 56 78"/>
                {errors.telephone&&<p style={{color:"#ef4444",fontSize:12,marginTop:4}}>{errors.telephone}</p>}
              </div>
              <div>
                <label style={lbl}>Email</label>
                <input type="email" style={inputS(!!errors.email)} value={form.email} onChange={e=>update("email",e.target.value)} placeholder="jean@email.com" autoComplete="off"/>
                {errors.email&&<p style={{color:"#ef4444",fontSize:12,marginTop:4}}>{errors.email}</p>}
              </div>
            </div>
          </div>
        )}

        {/* Étape 1 — RGPD */}
        {step===1 && (
          <div>
            <div style={{marginBottom:20}}>
              <h3 style={{fontSize:16,fontWeight:700,color:"#1a1a2e",marginBottom:4}}>Protection de vos données personnelles</h3>
              <p style={{fontSize:12,color:"#6b7280",lineHeight:1.6}}>Conformément au Règlement Général sur la Protection des Données (RGPD – UE 2016/679), nous vous informons de l'utilisation de vos données.</p>
            </div>

            <div style={{background:"#f9fafb",borderRadius:14,padding:"18px 20px",marginBottom:16,border:"1px solid #e5e7eb"}}>
              <div className="form-grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                {[
                  {icon:"🎯",title:"Finalité de la collecte",text:"Gestion de votre adhésion, traitement du prélèvement SEPA mensuel et suivi de votre dossier de donateur."},
                  {icon:"⚖️",title:"Base légale",text:"Art. 6.1.b RGPD — Exécution d'un contrat. Le traitement est nécessaire à l'exécution de votre adhésion."},
                  {icon:"🔒",title:"Sécurité & conservation",text:"Vos données sont chiffrées (TLS 1.3) et conservées 3 ans après la fin de votre adhésion, puis archivées 5 ans (obligations légales)."},
                  {icon:"🚫",title:"Pas de vente de données",text:"Vos données ne sont jamais vendues ni cédées à des tiers à des fins commerciales. Accès strictement limité à notre organisation."},
                ].map(item => (
                  <div key={item.title} style={{display:"flex",gap:10,alignItems:"flex-start"}}>
                    <span style={{fontSize:18,flexShrink:0}}>{item.icon}</span>
                    <div>
                      <p style={{fontSize:12,fontWeight:700,color:"#1a1a2e",marginBottom:3}}>{item.title}</p>
                      <p style={{fontSize:11,color:"#6b7280",lineHeight:1.55}}>{item.text}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div style={{background:"#eff6ff",borderRadius:12,padding:"12px 16px",marginBottom:16,border:"1px solid #bfdbfe"}}>
              <p style={{fontSize:12,color:"#1e40af",fontWeight:600,marginBottom:4}}>Vos droits (Art. 15 à 22 RGPD)</p>
              <p style={{fontSize:12,color:"#1d4ed8",lineHeight:1.6}}>Vous disposez d'un droit d'<strong>accès</strong>, de <strong>rectification</strong>, d'<strong>effacement</strong>, de <strong>portabilité</strong> et d'<strong>opposition</strong> au traitement de vos données. Pour exercer vos droits : <span style={{fontWeight:700}}>dpo@organisation.fr</span></p>
            </div>

            <div style={{marginTop:4}}>
              {[{key:"consentRgpd",required:true,label:"J'ai lu et j'accepte la politique de confidentialité. J'autorise le traitement de mes données personnelles dans le cadre de mon adhésion."},{key:"consentMarketing",required:false,label:"J'accepte de recevoir des communications sur les actualités et les actions de l'organisation. (optionnel)"}].map(({key,required,label}) => (
                <div key={key} onClick={()=>{setForm(f=>({...f,[key]:!f[key]}));setErrors(e=>({...e,[key]:undefined}));}} style={{display:"flex",gap:14,alignItems:"flex-start",padding:"14px 16px",borderRadius:12,border:`2px solid ${errors[key]?"#f87171":form[key]?"#6d28d9":"#e5e7eb"}`,background:form[key]?"#f5f3ff":"white",cursor:"pointer",marginBottom:10,transition:"all .15s"}}>
                  <div style={{width:22,height:22,borderRadius:6,border:`2px solid ${form[key]?"#6d28d9":"#d1d5db"}`,background:form[key]?"#6d28d9":"white",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1}}>{form[key]&&<span style={{color:"white",fontSize:11,fontWeight:700}}>✓</span>}</div>
                  <p style={{fontSize:13,color:"#374151",lineHeight:1.5,margin:0}}>{label}{required&&<span style={{color:"#ef4444",marginLeft:4}}>*</span>}</p>
                </div>
              ))}
              {errors.consentRgpd&&<p style={{color:"#ef4444",fontSize:12,marginTop:4}}>{errors.consentRgpd}</p>}
            </div>
          </div>
        )}

        {/* Étape 2 */}
        {step===2 && (
          <div>
            <div style={{marginBottom:20}}>
              <label style={lbl}>Montant du don mensuel (€)</label>
              <input
                type="number" min="10" step="0.01"
                value={form.montantDon}
                onChange={e=>update("montantDon",e.target.value)}
                placeholder="Minimum 10 €"
                style={{...inputS(montant > 0 && montant < 10), fontSize:16}}
              />
              {montant > 0 && montant < 10 && (
                <div style={{marginTop:8,background:"#fef2f2",border:"1px solid #fecaca",borderRadius:10,padding:"10px 14px",display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:18}}>⚠️</span>
                  <p style={{color:"#dc2626",fontSize:13,fontWeight:700}}>Le montant minimum est de <strong>10 €</strong> par mois. Montant saisi : {montant.toFixed(2)} €</p>
                </div>
              )}
            </div>
            {montant >= 10 && (
              <div className="form-grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                <div style={{background:"#f0fdf4",borderRadius:14,padding:"18px 14px",textAlign:"center",border:"1px solid #bbf7d0"}}>
                  <p style={{fontSize:10,fontWeight:700,color:"#14532d",textTransform:"uppercase",letterSpacing:".06em",marginBottom:8}}>Réduction 66%</p>
                  <p style={{fontSize:24,fontWeight:700,color:"#16a34a"}}>{defiscalisation} €</p>
                </div>
                <div style={{background:"#f0fdf4",borderRadius:14,padding:"18px 14px",textAlign:"center",border:"1px solid #bbf7d0"}}>
                  <p style={{fontSize:10,fontWeight:700,color:"#14532d",textTransform:"uppercase",letterSpacing:".06em",marginBottom:8}}>Coût réel</p>
                  <p style={{fontSize:24,fontWeight:700,color:"#16a34a"}}>{netDon} €</p>
                </div>
              </div>
            )}
          </div>
        )}

        {/* Étape 3 — IBAN + option RDV */}
        {step===3 && (
          <div>
            <div style={{marginBottom:20}}>
              <h3 style={{fontSize:16,fontWeight:700,color:"#1a1a2e",marginBottom:4}}>Coordonnées bancaires</h3>
              <p style={{fontSize:12,color:"#6b7280"}}>Saisissez l'IBAN pour le prélèvement SEPA, ou programmez un rappel si l'adhérent ne l'a pas sur lui.</p>
            </div>

            {/* Toggle IBAN / RDV */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:20}}>
              <div onClick={()=>update("ibanDiffere",false)} style={{padding:"12px 14px",borderRadius:12,border:`2px solid ${!form.ibanDiffere?"#6d28d9":"#e5e7eb"}`,background:!form.ibanDiffere?"#f5f3ff":"white",cursor:"pointer",textAlign:"center",transition:"all .15s"}}>
                <div style={{fontSize:20,marginBottom:4}}>🏦</div>
                <p style={{fontSize:13,fontWeight:700,color:!form.ibanDiffere?"#4c1d95":"#374151"}}>IBAN disponible</p>
                <p style={{fontSize:11,color:"#9ca3af"}}>Saisir maintenant</p>
              </div>
              <div onClick={()=>update("ibanDiffere",true)} style={{padding:"12px 14px",borderRadius:12,border:`2px solid ${form.ibanDiffere?"#f59e0b":"#e5e7eb"}`,background:form.ibanDiffere?"#fffbeb":"white",cursor:"pointer",textAlign:"center",transition:"all .15s"}}>
                <div style={{fontSize:20,marginBottom:4}}>📅</div>
                <p style={{fontSize:13,fontWeight:700,color:form.ibanDiffere?"#92400e":"#374151"}}>Rappel à programmer</p>
                <p style={{fontSize:11,color:"#9ca3af"}}>L'adhérent n'a pas l'IBAN</p>
              </div>
            </div>

            {!form.ibanDiffere ? (
              <div>
                <div style={{marginBottom:16}}>
                  <label style={lbl}>IBAN</label>
                  <div style={{position:"relative"}}>
                    <input value={form.iban} onChange={e=>update("iban",e.target.value)} placeholder="FR76 3000 6000 0112 3456 7890 189" style={{...inputS(!!errors.iban,form.ibanValid===true),fontFamily:"monospace",letterSpacing:".06em",paddingRight:48}}/>
                    {form.ibanValid!==null&&<div style={{position:"absolute",right:14,top:"50%",transform:"translateY(-50%)",width:24,height:24,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",background:form.ibanValid?"#dcfce7":"#fee2e2",fontSize:12,fontWeight:700,color:form.ibanValid?"#16a34a":"#ef4444"}}>{form.ibanValid?"✓":"✗"}</div>}
                  </div>
                  {form.ibanValid===true&&<p style={{color:"#16a34a",fontSize:12,marginTop:6,fontWeight:600}}>IBAN valide ✓</p>}
                  {errors.iban&&<p style={{color:"#ef4444",fontSize:12,marginTop:6}}>{errors.iban}</p>}
                </div>
                <div>
                  <label style={lbl}>BIC / SWIFT</label>
                  <input value={form.bic} onChange={e=>update("bic",e.target.value)} placeholder="BNPAFRPP" style={{...inputS(false,false),fontFamily:"monospace",letterSpacing:".06em"}}/>
                </div>
              </div>
            ) : (
              <div style={{background:"#fffbeb",borderRadius:14,padding:18,border:"1px solid #fde68a"}}>
                <p style={{fontSize:13,fontWeight:700,color:"#92400e",marginBottom:14}}>📞 Programmer un rappel téléphonique</p>
                <div className="form-grid-2 recap-grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
                  <div>
                    <label style={{...lbl,color:"#78350f"}}>Date du rappel</label>
                    <input type="date" value={form.rdvDate} onChange={e=>update("rdvDate",e.target.value)} min={new Date().toISOString().split("T")[0]} style={{...inputS(!!errors.rdvDate,false),background:errors.rdvDate?"#fff5f5":"white"}}/>
                    {errors.rdvDate&&<p style={{color:"#ef4444",fontSize:12,marginTop:4}}>{errors.rdvDate}</p>}
                  </div>
                  <div>
                    <label style={{...lbl,color:"#78350f"}}>Heure</label>
                    <input type="time" value={form.rdvHeure} onChange={e=>update("rdvHeure",e.target.value)} style={{...inputS(!!errors.rdvHeure,false),background:errors.rdvHeure?"#fff5f5":"white"}}/>
                    {errors.rdvHeure&&<p style={{color:"#ef4444",fontSize:12,marginTop:4}}>{errors.rdvHeure}</p>}
                  </div>
                </div>
                <div>
                  <label style={{...lbl,color:"#78350f"}}>Note pour le rappel <span style={{fontWeight:300,opacity:.6}}>(optionnel)</span></label>
                  <input value={form.rdvNote} onChange={e=>update("rdvNote",e.target.value)} placeholder="Ex : Rappeler en fin de journée, préfère le soir" style={{...inputS(false,false),background:"white"}}/>
                </div>
                <div style={{marginTop:12,background:"rgba(251,146,60,.12)",borderRadius:10,padding:"10px 14px"}}>
                  <p style={{fontSize:11,color:"#92400e",lineHeight:1.6}}>⚠️ Ce dossier sera marqué comme <strong>incomplet</strong> et apparaîtra dans votre liste de rappels sur le tableau de bord.</p>
                </div>
              </div>
            )}
          </div>
        )}

        {/* Étape 4 — Récap complet */}
        {step===4 && (
          <div>
            {/* Coordonnées complètes */}
            <div style={{background:"#f9fafb",borderRadius:14,padding:18,border:"1px solid #e5e7eb",marginBottom:12}}>
              <p style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:".08em",marginBottom:12}}>👤 Coordonnées civiles</p>
              <div className="recap-cells" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px 24px"}}>
                {[
                  ["Nom",form.nom],["Prénom",form.prenom],
                  ["Genre", form.sexe==="M"?"♂ Masculin":form.sexe==="F"?"♀ Féminin":form.sexe==="A"?"⚧ Autre":"—"],
                  ["Date de naissance",form.dateNaissance?new Date(form.dateNaissance+"T00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"}):"—"],
                  ["Adresse",form.adresse],
                  ["Code postal",form.codePostal],["Ville",form.ville],
                  ["Téléphone",form.telephone],["Email",form.email],
                ].map(([l,v]) => (
                  <div key={l} style={{padding:"5px 0",borderBottom:"1px solid #f3f4f6"}}><p style={{fontSize:10,color:"#9ca3af",marginBottom:2,fontWeight:700,textTransform:"uppercase"}}>{l}</p><p style={{fontSize:13,color:"#1a1a2e",fontWeight:500}}>{v||"—"}</p></div>
                ))}
              </div>
            </div>

            {/* RGPD */}
            <div style={{background:"#f9fafb",borderRadius:14,padding:18,border:"1px solid #e5e7eb",marginBottom:12}}>
              <p style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:".08em",marginBottom:12}}>🔒 Consentements RGPD</p>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {[["Politique de confidentialité",form.consentRgpd],["Communications marketing",form.consentMarketing]].map(([l,v]) => (
                  <div key={l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid #f3f4f6"}}>
                    <span style={{fontSize:12,color:"#4b5563"}}>{l}</span>
                    <span style={{fontSize:12,fontWeight:700,padding:"2px 10px",borderRadius:20,background:v?"#dcfce7":"#f3f4f6",color:v?"#16a34a":"#9ca3af"}}>{v?"Accepté":"Refusé"}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Don */}
            <div className="form-grid-2 recap-grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
              <div style={{background:"#f9fafb",borderRadius:14,padding:18,border:"1px solid #e5e7eb"}}>
                <p style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:".08em",marginBottom:12}}>💸 Don mensuel</p>
                {[
                  ["Montant",form.montantDon?`${parseFloat(form.montantDon).toFixed(2)} €`:"Non renseigné"],
                  ["Réduction 66%",form.montantDon?`${defiscalisation} €`:"—"],
                  ["Coût réel net",form.montantDon?`${netDon} €`:"—"],
                ].map(([l,v]) => (
                  <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #f3f4f6"}}><span style={{fontSize:12,color:"#6b7280"}}>{l}</span><span style={{fontSize:12,fontWeight:700,color:"#1a1a2e"}}>{v}</span></div>
                ))}
              </div>

              {/* Bancaire ou RDV */}
              <div style={{background: form.ibanDiffere?"#fffbeb":"#f9fafb",borderRadius:14,padding:18,border:`1px solid ${form.ibanDiffere?"#fde68a":"#e5e7eb"}`}}>
                {form.ibanDiffere ? (
                  <>
                    <p style={{fontSize:11,fontWeight:700,color:"#92400e",textTransform:"uppercase",letterSpacing:".08em",marginBottom:12}}>📅 Rappel programmé</p>
                    {[
                      ["Date",form.rdvDate?new Date(form.rdvDate+"T00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"}):"—"],
                      ["Heure",form.rdvHeure||"—"],
                      ["Note",form.rdvNote||"—"],
                    ].map(([l,v]) => (
                      <div key={l} style={{padding:"5px 0",borderBottom:"1px solid #fde68a"}}><p style={{fontSize:10,color:"#d97706",marginBottom:2,fontWeight:700,textTransform:"uppercase"}}>{l}</p><p style={{fontSize:12,color:"#78350f",fontWeight:500}}>{v}</p></div>
                    ))}
                  </>
                ) : (
                  <>
                    <p style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:".08em",marginBottom:12}}>🏦 Coordonnées bancaires</p>
                    {[["IBAN",form.iban],["BIC",form.bic]].map(([l,v]) => (
                      <div key={l} style={{padding:"5px 0",borderBottom:"1px solid #f3f4f6"}}><p style={{fontSize:10,color:"#9ca3af",marginBottom:2,fontWeight:700,textTransform:"uppercase"}}>{l}</p><p style={{fontSize:12,color:"#1a1a2e",fontFamily:"monospace"}}>{v||"—"}</p></div>
                    ))}
                  </>
                )}
              </div>
            </div>

            {/* Signature */}
            <div style={{marginBottom:16}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <p style={{fontSize:14,fontWeight:700,color:"#1a1a2e"}}>✍️ Signature de l'adhérent</p>
                <button onClick={clearSignature} style={{fontSize:12,color:"#6d28d9",background:"#f5f3ff",border:"1px solid #ddd6fe",padding:"6px 16px",borderRadius:20,cursor:"pointer",fontFamily:font,fontWeight:600}}>🗑 Effacer</button>
              </div>
              {/* Cadre de signature */}
              <div style={{border:"2px solid #c4b5fd",borderRadius:14,overflow:"hidden",background:"white",boxShadow:"0 4px 20px rgba(109,40,217,0.12)",position:"relative"}}>
                {/* Ligne de base */}
                <div style={{position:"absolute",bottom:44,left:20,right:20,borderBottom:"1px dashed #d1d5db",pointerEvents:"none",zIndex:1}}/>
                {/* Texte X */}
                <div style={{position:"absolute",bottom:32,left:20,color:"#9ca3af",fontSize:18,pointerEvents:"none",zIndex:1,lineHeight:1}}>✕</div>
                {/* Placeholder */}
                {!signature && (
                  <div style={{position:"absolute",top:"40%",left:"50%",transform:"translate(-50%,-50%)",color:"#d1d5db",fontSize:13,pointerEvents:"none",fontStyle:"italic",zIndex:1,textAlign:"center",userSelect:"none"}}>
                    Signez ici
                  </div>
                )}
                <canvas
                  ref={canvasRef}
                  width={800} height={200}
                  style={{width:"100%",height:200,display:"block",cursor:"crosshair",touchAction:"none"}}
                  onMouseDown={startDraw} onMouseMove={draw} onMouseUp={endDraw} onMouseLeave={endDraw}
                  onTouchStart={startDraw} onTouchMove={draw} onTouchEnd={endDraw}
                />
              </div>
              {!signature && <p style={{fontSize:11,color:"#9ca3af",marginTop:6,textAlign:"center",fontStyle:"italic"}}>Utilisez votre doigt ou la souris pour signer dans le cadre</p>}
              {signature && <p style={{fontSize:11,color:"#16a34a",marginTop:6,textAlign:"center",fontWeight:600}}>✓ Signature enregistrée</p>}
            </div>
            {submitError&&<div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:10,padding:"12px 16px",marginBottom:12,color:"#991b1b",fontSize:13}}>{submitError}</div>}
            <button onClick={handleSubmit} disabled={submitting} style={{width:"100%",padding:"16px",borderRadius:14,border:"none",background:submitting?"#9ca3af":"linear-gradient(135deg,#1e1b4b,#6d28d9)",color:"white",fontSize:15,fontWeight:700,cursor:submitting?"not-allowed":"pointer",fontFamily:font,boxShadow:"0 6px 24px rgba(76,29,149,.4)"}}>
              {submitting?"Enregistrement…":"Valider et soumettre le dossier ✓"}
            </button>
          </div>
        )}

        {/* Nav */}
        <div style={{display:"flex",justifyContent:"space-between",marginTop:28,paddingTop:20,borderTop:"1px solid #f3f4f6"}}>
          <button onClick={prev} disabled={step===0} style={{padding:"11px 24px",borderRadius:11,border:"2px solid #e5e7eb",background:step===0?"#f9fafb":"white",color:step===0?"#d1d5db":"#374151",fontSize:13,fontWeight:600,cursor:step===0?"not-allowed":"pointer",fontFamily:font}}>Précédent</button>
          <span style={{fontSize:12,color:"#9ca3af",alignSelf:"center"}}>Étape {step+1}/{steps.length}</span>
          {step<steps.length-1&&<button onClick={next} style={{padding:"11px 28px",borderRadius:11,border:"none",background:"linear-gradient(135deg,#4c1d95,#6d28d9)",color:"white",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:font,boxShadow:"0 4px 16px rgba(76,29,149,.35)"}}>Suivant</button>}
        </div>
      </div>
    );
  }

  // ── COMPLETION PANEL — Finalisation RIB ──────────────────────────
  function CompletionPanel({ adherent, onSuccess, onCancel }) {
    const [iban, setIban]           = useState("");
    const [bic, setBic]             = useState("");
    const [ibanValid, setIbanValid] = useState(null);
    const [error, setError]         = useState(null);
    const [submitting, setSubmitting] = useState(false);
    const [done, setDone]           = useState(false);

    function updateIban(v) {
      setIban(v);
      setIbanValid(isIBANComplete(v) ? validateIBAN(v) : null);
      setError(null);
    }

    async function handleSubmit() {
      if (!iban.trim()) { setError("L'IBAN est requis."); return; }
      if (ibanValid === false) { setError("IBAN invalide — vérifiez les chiffres."); return; }
      if (ibanValid === null)  { setError("IBAN incomplet."); return; }
      setSubmitting(true); setError(null);
      try {
        // On ne touche PAS à la signature — elle appartient à l'adhérent
        await supabaseUpdate("adherents", adherent.id, {
          iban,
          bic,
          incomplet: false,
          rdv_date: null,
          rdv_note: null,
        });
        setDone(true);
        setTimeout(() => onSuccess(), 1800);
      } catch(e) { setError("Erreur : " + e.message); }
      setSubmitting(false);
    }

    const inputS = (err, ok) => ({ border:`2px solid ${err?"#f87171":ok?"#22c55e":"#e2e8f0"}`, borderRadius:14, padding:"13px 16px", width:"100%", outline:"none", fontSize:14, fontFamily:font, background:err?"#fff5f5":ok?"#f0fdf4":"white", color:"#1a1a2e", boxSizing:"border-box" });
    const lbl = { fontSize:11, fontWeight:700, color:"#6b7280", display:"block", marginBottom:6, letterSpacing:".08em", textTransform:"uppercase" };
    const fmtDate = s => s ? new Date(s+"T00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"}) : "—";

    if (done) return (
      <div style={{textAlign:"center",padding:"60px 0"}}>
        <div style={{width:64,height:64,borderRadius:"50%",background:"#dcfce7",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",fontSize:28,color:"#16a34a"}}>✓</div>
        <h3 style={{fontFamily:serif,fontSize:26,color:"#1a1a2e",marginBottom:8}}>Adhésion finalisée !</h3>
        <p style={{color:"#6b7280",fontSize:14}}>Le RIB est enregistré — l'adhérent est maintenant actif.</p>
      </div>
    );

    return (
      <div>
        {/* En-tête identité */}
        <div style={{background:"linear-gradient(135deg,#1e1b4b,#4c1d95)",borderRadius:16,padding:"20px 24px",marginBottom:20,color:"white"}}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{width:48,height:48,borderRadius:14,background:"rgba(255,255,255,0.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>👤</div>
            <div>
              <h2 style={{fontFamily:serif,fontSize:22,fontWeight:600,marginBottom:2}}>{adherent.prenom} {adherent.nom}</h2>
              <p style={{fontSize:12,opacity:.7}}>Né(e) le {fmtDate(adherent.date_naissance)} · {adherent.ville}</p>
            </div>
            {adherent.montant_don && <div style={{marginLeft:"auto",textAlign:"right"}}>
              <p style={{fontSize:20,fontWeight:700,color:"#34d399"}}>{parseFloat(adherent.montant_don).toFixed(2)} €</p>
              <p style={{fontSize:10,opacity:.6,textTransform:"uppercase",letterSpacing:".06em"}}>don mensuel</p>
            </div>}
          </div>
        </div>

        {/* Récap fiche */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}}>
          {[
            {title:"📍 Adresse",     items:[["Adresse",adherent.adresse],["CP / Ville",`${adherent.code_postal||""} ${adherent.ville||""}`]]},
            {title:"📞 Contact",     items:[["Téléphone",adherent.telephone],["Email",adherent.email]]},
            {title:"🔒 RGPD",        items:[["Confidentialité",adherent.consent_rgpd?"✅ Accepté":"❌ Refusé"],["Marketing",adherent.consent_marketing?"✅ Accepté":"—"]]},
            {title:"💸 Don mensuel", items:[["Montant",adherent.montant_don?`${parseFloat(adherent.montant_don).toFixed(2)} €`:"—"],["Coût net",adherent.cout_net?`${parseFloat(adherent.cout_net).toFixed(2)} €`:"—"]]},
          ].map(sec => (
            <div key={sec.title} style={{background:"#f9fafb",borderRadius:12,padding:"14px 16px",border:"1px solid #e5e7eb"}}>
              <p style={{fontSize:10,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:".08em",marginBottom:10}}>{sec.title}</p>
              {sec.items.map(([l,v]) => (
                <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:"1px solid #f3f4f6"}}>
                  <span style={{fontSize:12,color:"#6b7280"}}>{l}</span>
                  <span style={{fontSize:12,fontWeight:600,color:"#1a1a2e",textAlign:"right",maxWidth:"60%",wordBreak:"break-all"}}>{v||"—"}</span>
                </div>
              ))}
            </div>
          ))}
        </div>

        {/* Signature originale — lecture seule, non modifiable */}
        {adherent.signature && (
          <div style={{background:"#f9fafb",borderRadius:14,padding:"16px 18px",marginBottom:20,border:"1px solid #e5e7eb"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
              <span style={{fontSize:14}}>✍️</span>
              <p style={{fontSize:12,fontWeight:700,color:"#374151"}}>Signature de l'adhérent</p>
              <span style={{fontSize:11,padding:"2px 10px",borderRadius:20,background:"#dcfce7",color:"#16a34a",fontWeight:700,marginLeft:"auto"}}>✓ Enregistrée</span>
            </div>
            <img src={adherent.signature} alt="Signature" style={{width:"100%",borderRadius:8,background:"white",padding:8,border:"1px solid #e5e7eb",maxHeight:100,objectFit:"contain"}}/>
            <p style={{fontSize:11,color:"#9ca3af",marginTop:6,fontStyle:"italic"}}>Signature recueillie lors de l'entretien — elle ne peut pas être modifiée par le recruteur.</p>
          </div>
        )}

        {/* Rappel d'origine */}
        {adherent.rdv_date && (
          <div style={{background:"#fffbeb",borderRadius:12,padding:"12px 16px",marginBottom:20,border:"1px solid #fde68a",display:"flex",gap:10,alignItems:"flex-start"}}>
            <span style={{fontSize:18}}>📅</span>
            <div>
              <p style={{fontSize:12,fontWeight:700,color:"#92400e",marginBottom:2}}>Rappel d'origine</p>
              <p style={{fontSize:12,color:"#78350f"}}>{new Date(adherent.rdv_date).toLocaleDateString("fr-FR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"})} à {new Date(adherent.rdv_date).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</p>
              {adherent.rdv_note && <p style={{fontSize:11,color:"#d97706",marginTop:2,fontStyle:"italic"}}>"{adherent.rdv_note}"</p>}
            </div>
          </div>
        )}

        {/* Séparateur */}
        <div style={{borderTop:"2px dashed #e5e7eb",margin:"4px 0 20px",position:"relative"}}>
          <span style={{position:"absolute",top:-11,left:"50%",transform:"translateX(-50%)",background:"#fafaf9",padding:"0 12px",fontSize:11,color:"#9ca3af",fontWeight:700,textTransform:"uppercase",letterSpacing:".08em"}}>RIB à compléter</span>
        </div>

        {/* IBAN */}
        <div style={{marginBottom:16}}>
          <label style={lbl}>IBAN *</label>

  // ── GENDER BAR ────────────────────────────────────────────────────
  function GenderBar({ sexeStats, total, compact = false }) {
    if (!sexeStats || total === 0) return null;
    const { H, F, A, NR } = sexeStats;
    const pct = n => total > 0 ? Math.round(n / total * 100) : 0;
    const segments = [
      { key:"H", label:"♂ Hommes",  n:H, color:"#3b82f6", light:"rgba(59,130,246,.15)" },
      { key:"F", label:"♀ Femmes",  n:F, color:"#ec4899", light:"rgba(236,72,153,.15)" },
      { key:"A", label:"⚧ Autre",   n:A, color:"#8b5cf6", light:"rgba(139,92,246,.15)" },
      { key:"NR",label:"— N/R",     n:NR,color:"#6b7280", light:"rgba(107,114,128,.1)" },
    ].filter(s => s.n > 0);

    return (
      <div>
        {/* Barre empilée */}
        <div style={{display:"flex",borderRadius:8,overflow:"hidden",height:compact?18:28,marginBottom:compact?8:12,gap:1}}>
          {segments.map(s => (
            <div key={s.key} style={{width:`${pct(s.n)}%`,background:s.color,minWidth:s.n>0?4:0,transition:"width .6s",display:"flex",alignItems:"center",justifyContent:"center"}}>
              {!compact && pct(s.n) >= 12 && <span style={{fontSize:10,fontWeight:700,color:"white"}}>{pct(s.n)}%</span>}
            </div>
          ))}
        </div>
        {/* Légende */}
        <div style={{display:"flex",gap:compact?8:14,flexWrap:"wrap"}}>
          {segments.map(s => (
            <div key={s.key} style={{display:"flex",alignItems:"center",gap:5,background:s.light,padding:compact?"3px 8px":"4px 10px",borderRadius:20,border:`1px solid ${s.color}30`}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:s.color,flexShrink:0}}/>
              <span style={{fontSize:compact?10:12,color:"rgba(255,255,255,0.7)",fontWeight:600}}>{s.label}</span>
              <span style={{fontSize:compact?10:12,fontWeight:700,color:"white"}}>{s.n}</span>
              <span style={{fontSize:compact?9:11,color:"rgba(255,255,255,0.4)"}}>({pct(s.n)}%)</span>
            </div>
          ))}
        </div>
      </div>
    );
  }

            Exemple : 3 adhérents sur {heuresJour}h = <strong style={{color:"#fb923c"}}>{(3/heuresJour).toFixed(2)} adh/h</strong>.
            Modifiez vos heures/jour avec le bouton ✏️ ci-dessus.

  function App() {
    const [currentUser, setCurrentUser] = useState(null);
    const [authLoading, setAuthLoading] = useState(true); // attend la vérif de session initiale
    const [page, setPage]             = useState("dashboard");
    const [stats, setStats]           = useState(null);
    const [statsError, setStatsError] = useState(null);
    const [statsOffline, setStatsOffline] = useState(null);
    const [offlinePending, setOfflinePending] = useState([]);
    const [rappels, setRappels]       = useState([]);
    const [rappelSelected, setRappelSelected] = useState(null);

    // ── Supabase Auth : vérification de session au démarrage ─────────
    useEffect(() => {
      // Vérifier si une session existe déjà (ex: rafraîchissement de page)
      supabase.auth.getSession().then(async ({ data: { session } }) => {
        if (session) {
          const { data: profil } = await supabase
            .from("collecteurs").select("*").eq("auth_user_id", session.user.id).single();
          const user = profil ?? { id: session.user.id, email: session.user.email, prenom: session.user.user_metadata?.prenom ?? "Collecteur", nom: session.user.user_metadata?.nom ?? "" };
          setCurrentUser(user);
        }
        setAuthLoading(false);
      });

      // Écouter les changements de session (connexion / déconnexion / expiration)
      const { data: { subscription } } = supabase.auth.onAuthStateChange(async (event, session) => {
        if (event === "SIGNED_OUT" || !session) {
          setCurrentUser(null);
          setStats(null);
        }
        if (event === "TOKEN_REFRESHED" && session) {
          // Token renouvelé automatiquement — rien à faire, getAuthHeaders() récupère le nouveau
        }
      });
      return () => subscription.unsubscribe();
    }, []);

    // La page de connexion est gérée par LoginScreen (ligne if (!currentUser))
    useEffect(() => {
      if (currentUser) {
        loadStats();
        loadOfflinePending();
      }
    }, [currentUser]);

    async function loadOfflinePending() {
      const queue = await readOfflineQueue();
      setOfflinePending(queue.map(item => ({
        ...item.data,
        id: "offline_" + item.id,
        _queueId: item.id,
        created_at: item.savedAt,
        _offline: true,
      })));
    }

    async function deleteRappel(id) {
      try {
        await supabaseDelete("adherents", id);
        setRappels(prev => prev.filter(r => r.id !== id));
      } catch(e) { alert("Erreur suppression : " + e.message); }
    }

    // Lire la queue IndexedDB (bulletins soumis hors-ligne)
    function readOfflineQueue() {
      return new Promise((resolve) => {
        try {
          const req = indexedDB.open('adhesion-v8', 1);
          req.onsuccess = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains('queue')) { resolve([]); return; }
            const tx = db.transaction('queue', 'readonly');
            const r = tx.objectStore('queue').getAll();
            r.onsuccess = () => resolve(r.result || []);
            r.onerror = () => resolve([]);
          };
          req.onerror = () => resolve([]);
        } catch(e) { resolve([]); }
      });
    }

    async function loadFromCache() {
      const cached = localStorage.getItem("stats_cache_" + currentUser.id);
      // Lire aussi la queue hors-ligne
      const queue = await readOfflineQueue();
      const queueRows = queue.map(item => ({
        ...item.data,
        id: "offline_" + item.id,
        created_at: item.savedAt,
        _offline: true,
      }));

      if (cached) {
        try {
          const { stats: cachedStats, rappels: cachedRappels, ts } = JSON.parse(cached);
          // Fusionner avec les bulletins hors-ligne non encore sync
          if (queueRows.length > 0) {
            cachedStats.today = (cachedStats.today || 0) + queueRows.length;
            cachedStats.total = (cachedStats.total || 0) + queueRows.length;
            if (cachedStats.todayStats) cachedStats.todayStats.total = (cachedStats.todayStats.total || 0) + queueRows.length;
            if (cachedStats.allStats) cachedStats.allStats.total = (cachedStats.allStats.total || 0) + queueRows.length;
          }
          setStats(cachedStats);
          setRappels([...( cachedRappels || []), ...queueRows.filter(r => r.incomplet)]);
          const offlineMsg = queueRows.length > 0
            ? "📵 Hors-ligne — " + queueRows.length + " bulletin(s) en attente de sync · Cache du " + new Date(ts).toLocaleDateString("fr-FR") + " " + new Date(ts).toLocaleTimeString("fr-FR", {hour:"2-digit",minute:"2-digit"})
            : "📵 Hors-ligne — Cache du " + new Date(ts).toLocaleDateString("fr-FR") + " " + new Date(ts).toLocaleTimeString("fr-FR", {hour:"2-digit",minute:"2-digit"});
          setStatsOffline(offlineMsg);
          setStatsError(null);
          return true;
        } catch(e) { return false; }
      } else if (queueRows.length > 0) {
        // Pas de cache Supabase mais des bulletins hors-ligne → les afficher quand même
        setStatsOffline("📵 Hors-ligne — " + queueRows.length + " bulletin(s) enregistré(s) localement, en attente de synchronisation.");
        setStatsError(null);
        return true;
      }
      return false;
    }

    async function loadStats() {
      try {
        const rows = await supabaseFetch("adherents", `&collecteur_id=eq.${currentUser.id}`);
        const incomplets = rows.filter(r => r.incomplet === true);
        const adherents  = rows.filter(r => !r.incomplet);

        const todayStr = new Date().toISOString().split("T")[0];

        // ── Semaine courante (lundi → dimanche) ───────────────────────
        const now = new Date();
        const dayOfWeek = (now.getDay() + 6) % 7; // 0=lundi
        const monday = new Date(now); monday.setDate(now.getDate() - dayOfWeek); monday.setHours(0,0,0,0);
        const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); sunday.setHours(23,59,59,999);

        function getWeekKey(date) {
          const d = new Date(date);
          const dow = (d.getDay() + 6) % 7;
          const mon = new Date(d); mon.setDate(d.getDate() - dow); mon.setHours(0,0,0,0);
          return mon.toISOString().split("T")[0];
        }

        function computeStats(list) {
          const total = list.length;
          const ages = list.map(r => calcAge(r.date_naissance)).filter(a => a!==null && a>0 && a<120);
          const avgAge = ages.length>0 ? ages.reduce((s,a)=>s+a,0)/ages.length : null;
          const sorted = [...ages].sort((a,b)=>a-b);
          const medianAge = sorted.length>0
            ? (sorted.length%2===0
                ? (sorted[sorted.length/2-1]+sorted[sorted.length/2])/2
                : sorted[Math.floor(sorted.length/2)])
            : null;
          const dons = list.map(r=>parseFloat(r.montant_don)).filter(d=>!isNaN(d)&&d>0);
          const avgDon = dons.length>0 ? dons.reduce((s,d)=>s+d,0)/dons.length : null;
          const totalDons = dons.reduce((s,d)=>s+d,0);
          const ageTranches = [
            { label:"18–25", min:18, max:25, color:"#a78bfa" },
            { label:"26–35", min:26, max:35, color:"#60a5fa" },
            { label:"36–45", min:36, max:45, color:"#34d399" },
            { label:"46–57", min:46, max:57, color:"#fbbf24" },
            { label:"58–69", min:58, max:69, color:"#fb923c" },
            { label:"70–99", min:70, max:99, color:"#f472b6" },
          ].map(t => ({ ...t, value: ages.filter(a=>a>=t.min&&a<=t.max).length }));
          const donTranches = [
            { label:"10–15€", color:"#a78bfa", value: list.filter(r=>r.montant_don>=10&&r.montant_don<15).length },
            { label:"15–20€", color:"#60a5fa", value: list.filter(r=>r.montant_don>=15&&r.montant_don<20).length },
            { label:"20–25€", color:"#34d399", value: list.filter(r=>r.montant_don>=20&&r.montant_don<25).length },
            { label:"25–30€", color:"#fbbf24", value: list.filter(r=>r.montant_don>=25&&r.montant_don<30).length },
            { label:"30–35€", color:"#fb923c", value: list.filter(r=>r.montant_don>=30&&r.montant_don<35).length },
            { label:"35–40€", color:"#f472b6", value: list.filter(r=>r.montant_don>=35&&r.montant_don<40).length },
            { label:"40–50€", color:"#f87171", value: list.filter(r=>r.montant_don>=40&&r.montant_don<50).length },
            { label:"50€+",   color:"#4ade80", value: list.filter(r=>r.montant_don>=50).length },
          ];
          const nbH = list.filter(r=>r.sexe==="M").length;
          const nbF = list.filter(r=>r.sexe==="F").length;
          const nbA = list.filter(r=>r.sexe==="A").length;
          const nbNR = total - nbH - nbF - nbA;
          const sexeStats = { H:nbH, F:nbF, A:nbA, NR:nbNR };
          return { total, avgAge, medianAge, avgDon, totalDons, ageTranches, donTranches, sexeStats };
        }

        // ── Filtres par période ───────────────────────────────────────
        const todayAdh  = adherents.filter(r => r.created_at && r.created_at.startsWith(todayStr));
        const weekAdh   = adherents.filter(r => {
          if (!r.created_at) return false;
          const d = new Date(r.created_at);
          return d >= monday && d <= sunday;
        });

        // ── Jours travaillés (jours avec ≥1 adhérent) ─────────────────
        const allDays = new Set(adherents.map(r => r.created_at?.split("T")[0]).filter(Boolean));
        const totalWorkDays = allDays.size || 1;

        const weekDays = new Set(weekAdh.map(r => r.created_at?.split("T")[0]).filter(Boolean));
        const workDaysThisWeek = weekDays.size || (todayAdh.length > 0 ? 1 : 0);

        // ── Détail jour par jour (14 derniers jours) ──────────────────
        const dailyBreakdown = [];
        for (let i = 13; i >= 0; i--) {
          const d = new Date(now); d.setDate(now.getDate() - i);
          const dateStr = d.toISOString().split("T")[0];
          const dayList = adherents.filter(r => r.created_at?.startsWith(dateStr));
          if (dayList.length > 0 || i === 0) {
            const s = computeStats(dayList);
            dailyBreakdown.push({ date: dateStr, count: dayList.length, avgDon: s.avgDon, avgAge: s.avgAge });
          }
        }

        // ── Détail semaine par semaine ─────────────────────────────────
        const weekMap = {};
        adherents.forEach(r => {
          if (!r.created_at) return;
          const wk = getWeekKey(r.created_at);
          if (!weekMap[wk]) weekMap[wk] = [];
          weekMap[wk].push(r);
        });
        const weeklyBreakdown = Object.entries(weekMap)
          .sort(([a],[b]) => a.localeCompare(b))
          .map(([wk, list]) => {
            const s = computeStats(list);
            const monDate = new Date(wk+"T12:00:00");
            const sunDate = new Date(monDate); sunDate.setDate(monDate.getDate()+6);
            const fmt = d => d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short"});
            const daysInWeek = new Set(list.map(r=>r.created_at?.split("T")[0]).filter(Boolean)).size;
            return {
              weekLabel: `${fmt(monDate)} – ${fmt(sunDate)}`,
              count: list.length,
              workDays: daysInWeek,
              avgDon: s.avgDon,
              totalDons: s.totalDons,
            };
          });

        const todaySt = computeStats(todayAdh);
        const weekSt  = computeStats(weekAdh);
        const allSt   = computeStats(adherents);

        const statsObj = {
          today: todaySt.total,
          todayStats:  todaySt,
          weekStats:   weekSt,
          allStats:    allSt,
          total: allSt.total,
          totalWorkDays,
          workDaysThisWeek,
          dailyBreakdown,
          weeklyBreakdown,
          // Rétro-compat
          avgAge: allSt.avgAge,
          medianAge: allSt.medianAge,
          avgDon: allSt.avgDon,
          totalDons: allSt.totalDons,
          perHour: allSt.total / (totalWorkDays * 6.25),
          ageTranches: allSt.ageTranches,
          donTranches: allSt.donTranches,
        };
        setStats(statsObj);
        setRappels(incomplets);

        try {
          localStorage.setItem("stats_cache_" + currentUser.id, JSON.stringify({
            stats: statsObj, rappels: incomplets, ts: new Date().toISOString()
          }));
        } catch(e) {}

      } catch(e) {
        // Fetch échoué (hors-ligne) → charger depuis le cache
        const fromCache = loadFromCache();
        if (!fromCache) {
          setStatsOffline("📵 Hors-ligne — Aucune donnée disponible. Ouvrez le dashboard en ligne pour activer le cache.");
          setStatsError(null);
        }
      }
    }
