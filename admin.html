<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1e1b4b" />
  <title>Admin — La Graine</title>
  <link rel="stylesheet" href="libs/fonts.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a091a; font-family: 'DM Sans', sans-serif; min-height: 100vh; color: white; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pulse { 0%,100% { opacity:.6; } 50% { opacity:1; } }
    @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .fade-in { animation: fadeIn 0.45s ease forwards; }
    .loading-dot { animation: pulse 1.4s infinite; }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 24px; transition: border-color .2s, background .2s; }
    .card:hover { background: rgba(255,255,255,0.06); border-color: rgba(124,58,237,0.35); }
    .stat-value { font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 700; line-height: 1; }
    .stat-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-top: 6px; }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .badge-green { background: rgba(34,197,94,.15); color: #4ade80; border: 1px solid rgba(34,197,94,.25); }
    .badge-purple { background: rgba(124,58,237,.2); color: #a78bfa; border: 1px solid rgba(124,58,237,.3); }
    .badge-blue { background: rgba(59,130,246,.15); color: #60a5fa; border: 1px solid rgba(59,130,246,.25); }
    .badge-orange { background: rgba(251,146,60,.15); color: #fb923c; border: 1px solid rgba(251,146,60,.25); }
    .nav-link { color: rgba(255,255,255,0.55); text-decoration: none; font-size: 13px; font-weight: 500; padding: 7px 13px; border-radius: 10px; transition: background .2s, color .2s; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; background: transparent; white-space: nowrap; }
    .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.08); color: white; }
    .th { padding: 11px 13px; text-align: left; color: rgba(255,255,255,0.4); font-weight: 700; letter-spacing: .06em; font-size: 10px; text-transform: uppercase; cursor: pointer; white-space: nowrap; user-select: none; }
    .th:hover { color: rgba(255,255,255,0.7); }
    .tr-row { border-bottom: 1px solid rgba(255,255,255,0.05); transition: background .15s; }
    .tr-row:hover { background: rgba(124,58,237,0.08) !important; }
    .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%); background-size: 400px 100%; animation: shimmer 1.5s infinite; border-radius: 8px; height: 16px; }
    .tab-btn { padding: 8px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: rgba(255,255,255,0.5); cursor: pointer; font-family: 'DM Sans',sans-serif; font-size: 13px; font-weight: 600; transition: all .2s; }
    .tab-btn.active { background: rgba(124,58,237,.25); border-color: rgba(124,58,237,.5); color: #c4b5fd; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="libs/react.min.js"></script>
  <script src="libs/react-dom.min.js"></script>
  <script src="libs/babel.min.js"></script>
  <script type="text/babel">
  const { useState, useEffect, useCallback, useMemo } = React;

  const SUPABASE_URL = "https://couruebftrtlqwffdavz.supabase.co";
  const SUPABASE_KEY = "sb_publishable_XKVDlf9Bem837GPgx8RNqw_lgs9Q6zc";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const font  = "'DM Sans', sans-serif";
  const serif = "'Cormorant Garamond', serif";

  function calcAge(d) {
    if (!d) return null;
    const p = String(d).split(/[-\/]/);
    if (p.length < 3) return null;
    const [y,m,day] = [parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])];
    if (isNaN(y)||isNaN(m)||isNaN(day)) return null;
    const n = new Date(); let a = n.getFullYear()-y;
    if (n.getMonth()<m||(n.getMonth()===m&&n.getDate()<day)) a--;
    return (a>=0&&a<120)?a:null;
  }

  function fmtDate(s) {
    if (!s) return "—";
    return new Date(s).toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"});
  }

  function getWeekBounds(d=new Date()) {
    const day=(d.getDay()+6)%7;
    const mon=new Date(d); mon.setHours(0,0,0,0); mon.setDate(d.getDate()-day);
    const sun=new Date(mon); sun.setDate(mon.getDate()+6); sun.setHours(23,59,59,999);
    return {mon,sun};
  }

  function exportCSV(rows, fn="export") {
    const h=["ID","Date","Nom","Prénom","Naissance","CP","Ville","Tél","Email","Don (€)","IBAN","BIC","Collecteur_ID"];
    const l=rows.map(r=>[r.id,fmtDate(r.created_at),r.nom,r.prenom,r.date_naissance,r.code_postal,r.ville,r.telephone,r.email,r.montant_don??"",r.iban,r.bic,r.collecteur_id??""].map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(","));
    const b=new Blob(["\uFEFF"+[h.join(",",...l)].join("\n")],{type:"text/csv;charset=utf-8;"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=`${fn}_${new Date().toISOString().slice(0,10)}.csv`; a.click();
  }

  async function getHeaders() {
    const {data:{session}} = await sb.auth.getSession();
    return {apikey:SUPABASE_KEY,Authorization:`Bearer ${session?.access_token??SUPABASE_KEY}`};
  }

  async function sbFetch(table,extra="") {
    const h=await getHeaders();
    const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=*${extra}&order=created_at.desc`,{headers:h});
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }

  async function sbDelete(table,id) {
    const h=await getHeaders();
    const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`,{method:"DELETE",headers:{...h,"Content-Type":"application/json"}});
    if (!r.ok) throw new Error(await r.text());
  }

  // ── MINI BAR ─────────────────────────────────────────────────────
  function MiniBar({data,color="#a78bfa"}) {
    const max=Math.max(...data.map(d=>d.value),1);
    return (
      <div style={{display:"flex",alignItems:"flex-end",gap:4,height:56}}>
        {data.map((d,i)=>(
          <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
            <div style={{width:"100%",background:color,borderRadius:"4px 4px 0 0",height:`${Math.max((d.value/max)*50,d.value>0?4:0)}px`,opacity:0.6+(i/data.length)*0.4}}/>
            <span style={{fontSize:9,color:"rgba(255,255,255,0.3)",whiteSpace:"nowrap"}}>{d.label}</span>
          </div>
        ))}
      </div>
    );
  }

  // ── PIE CHART ────────────────────────────────────────────────────
  function PieChart({data,size=160}) {
    const total=data.reduce((s,d)=>s+d.value,0);
    if (!total) return <p style={{color:"rgba(255,255,255,0.3)",fontSize:13,textAlign:"center",padding:"16px 0"}}>Aucune donnée</p>;
    const cx=size/2,cy=size/2,r=size/2-6; let cum=-Math.PI/2;
    const slices=data.map(d=>{
      const angle=(d.value/total)*2*Math.PI;
      const x1=cx+r*Math.cos(cum),y1=cy+r*Math.sin(cum); cum+=angle;
      return {...d,x1,y1,x2:cx+r*Math.cos(cum),y2:cy+r*Math.sin(cum),large:angle>Math.PI?1:0};
    }).filter(s=>s.value>0);
    const [hov,setHov]=useState(null);
    return (
      <div style={{display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
        <svg width={size} height={size} style={{flexShrink:0}}>
          {slices.map((s,i)=>(
            <path key={i} d={`M ${cx} ${cy} L ${s.x1} ${s.y1} A ${r} ${r} 0 ${s.large} 1 ${s.x2} ${s.y2} Z`}
              fill={s.color} opacity={hov===i?1:0.82} stroke="#0a091a" strokeWidth={2} style={{cursor:"pointer"}}
              onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}/>
          ))}
          {hov!==null&&slices[hov]&&<text x={cx} y={cy-5} textAnchor="middle" fill="white" fontSize={13} fontWeight={700}>{slices[hov].value}</text>}
          {hov!==null&&slices[hov]&&<text x={cx} y={cy+10} textAnchor="middle" fill="rgba(255,255,255,0.5)" fontSize={10}>{((slices[hov].value/total)*100).toFixed(0)}%</text>}
          {hov===null&&<text x={cx} y={cy+5} textAnchor="middle" fill="rgba(255,255,255,0.35)" fontSize={11}>{total}</text>}
        </svg>
        <div style={{flex:1,display:"flex",flexDirection:"column",gap:5}}>
          {data.map((d,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:6,opacity:d.value===0?0.3:1}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:d.color,flexShrink:0}}/>
              <span style={{fontSize:11,color:"rgba(255,255,255,0.6)",flex:1}}>{d.label}</span>
              <span style={{fontSize:11,fontWeight:700,color:"white"}}>{d.value}</span>
              <span style={{fontSize:10,color:"rgba(255,255,255,0.3)",minWidth:26,textAlign:"right"}}>{total>0?((d.value/total)*100).toFixed(0):0}%</span>
            </div>
          ))}
        </div>
      </div>
    );
  }

  function KpiCard({icon,label,value,unit="",color="#a78bfa",sub}) {
    return (
      <div className="card fade-in" style={{textAlign:"center"}}>
        <div style={{fontSize:24,marginBottom:10}}>{icon}</div>
        <div className="stat-value" style={{color}}>{value}<span style={{fontSize:16,fontWeight:300,color:"rgba(255,255,255,0.35)",marginLeft:4}}>{unit}</span></div>
        <div className="stat-label">{label}</div>
        {sub&&<div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginTop:5}}>{sub}</div>}
      </div>
    );
  }

  // ── STATS COLLECTEUR (Jour / Semaine / Mission) ───────────────────
  function CollecteurCard({col,adherents,heuresJour}) {
    const [view,setView]=useState("mission");
    const adhs=useMemo(()=>adherents.filter(a=>a.collecteur_id===col.id&&!a.incomplet),[adherents,col.id]);
    const incom=useMemo(()=>adherents.filter(a=>a.collecteur_id===col.id&&a.incomplet===true),[adherents,col.id]);
    const now=new Date();
    const todayStr=now.toDateString();
    const {mon:wMon,sun:wSun}=getWeekBounds(now);
    const todayA=adhs.filter(a=>new Date(a.created_at).toDateString()===todayStr);
    const weekA=adhs.filter(a=>{const d=new Date(a.created_at);return d>=wMon&&d<=wSun;});
    const current=view==="jour"?todayA:view==="semaine"?weekA:adhs;
    const uniqueDays=(arr)=>[...new Set(arr.map(a=>new Date(a.created_at).toDateString()))].length;
    const workDays=view==="jour"?(todayA.length>0?1:0):view==="semaine"?uniqueDays(weekA):uniqueDays(adhs);
    const hTotal=Math.max(workDays,1)*heuresJour;
    const dons=current.map(r=>parseFloat(r.montant_don)).filter(d=>!isNaN(d)&&d>0);
    const avgDon=dons.length>0?dons.reduce((s,d)=>s+d,0)/dons.length:null;
    const ages=current.map(r=>calcAge(r.date_naissance)).filter(a=>a!==null&&a>0&&a<120);
    const avgAge=ages.length>0?ages.reduce((s,a)=>s+a,0)/ages.length:null;
    const perHour=current.length/hTotal;
    const ageTranches=[
      {label:"18–25",min:18,max:25,color:"#a78bfa"},{label:"26–35",min:26,max:35,color:"#60a5fa"},
      {label:"36–45",min:36,max:45,color:"#34d399"},{label:"46–57",min:46,max:57,color:"#fbbf24"},
      {label:"58–69",min:58,max:69,color:"#fb923c"},{label:"70–99",min:70,max:99,color:"#f472b6"},
    ].map(t=>({...t,value:ages.filter(a=>a>=t.min&&a<=t.max).length}));

    // Détail jours (mission seulement)
    const dailyRows=view==="mission"?Array.from({length:14},(_,i)=>{
      const d=new Date(now); d.setDate(now.getDate()-(13-i));
      const da=adhs.filter(a=>new Date(a.created_at).toDateString()===d.toDateString());
      const dd=da.map(r=>parseFloat(r.montant_don)).filter(x=>!isNaN(x)&&x>0);
      return {date:d.toLocaleDateString("fr-FR",{weekday:"short",day:"2-digit",month:"2-digit"}),count:da.length,avgDon:dd.length>0?dd.reduce((s,x)=>s+x,0)/dd.length:null,ratio:da.length>0?(da.length/heuresJour).toFixed(2):"—",isToday:d.toDateString()===todayStr};
    }).filter(r=>r.count>0):[];

    return (
      <div style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:20,padding:26,marginBottom:18}}>
        {/* Header */}
        <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:18,paddingBottom:16,borderBottom:"1px solid rgba(255,255,255,0.07)"}}>
          <div style={{width:44,height:44,borderRadius:14,background:"linear-gradient(135deg,#4c1d95,#6d28d9)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>
            {col.role==="admin"?"⚙️":col.role==="responsable"?"👔":"🚶"}
          </div>
          <div style={{flex:1}}>
            <h2 style={{fontFamily:serif,fontSize:20,color:"white",fontWeight:600,marginBottom:2}}>{col.prenom} {col.nom}</h2>
            <span style={{fontSize:11,color:"rgba(255,255,255,0.4)"}}>{col.email}</span>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontFamily:serif,fontSize:28,color:"#a78bfa",fontWeight:700,lineHeight:1}}>{adhs.length}</div>
            <div style={{fontSize:9,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",letterSpacing:".08em",marginTop:2}}>total mission</div>
            {incom.length>0&&<div style={{fontSize:10,color:"#fb923c",fontWeight:700,marginTop:2}}>+{incom.length} incomplet{incom.length>1?"s":""}</div>}
          </div>
        </div>

        {/* Onglets */}
        <div style={{display:"flex",gap:8,marginBottom:18}}>
          {[{k:"jour",l:"📅 Aujourd'hui"},{k:"semaine",l:"📆 Semaine"},{k:"mission",l:"🏁 Mission"}].map(t=>(
            <button key={t.k} onClick={()=>setView(t.k)} className={`tab-btn${view===t.k?" active":""}`}>{t.l}</button>
          ))}
        </div>

        {current.length===0?(
          <p style={{color:"rgba(255,255,255,0.3)",fontSize:13,textAlign:"center",padding:"16px 0"}}>Aucun adhérent {view==="jour"?"aujourd'hui":view==="semaine"?"cette semaine":"enregistré"}</p>
        ):(
          <>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:view==="mission"?20:0}}>
              {[
                {icon:"👥",label:"Adhérents",value:current.length,color:"#a78bfa",sub:`${workDays}j × ${heuresJour}h`},
                {icon:"⏱️",label:"Adh / heure",value:perHour.toFixed(2),unit:"/h",color:"#fbbf24",sub:`${current.length} ÷ ${hTotal.toFixed(2)}h`},
                {icon:"💸",label:"Don moyen",value:avgDon!==null?avgDon.toFixed(2):"—",unit:"€",color:"#34d399",sub:`Vol: ${dons.reduce((s,d)=>s+d,0).toFixed(0)} €/mois`},
                {icon:"🎂",label:"Âge moyen",value:avgAge!==null?avgAge.toFixed(1):"—",unit:"ans",color:"#fb923c"},
              ].map(k=>(
                <div key={k.label} style={{background:"rgba(255,255,255,0.04)",borderRadius:14,padding:"14px 16px",border:"1px solid rgba(255,255,255,0.07)",textAlign:"center"}}>
                  <div style={{fontSize:18,marginBottom:6}}>{k.icon}</div>
                  <div style={{fontFamily:serif,fontSize:22,fontWeight:700,color:k.color,lineHeight:1}}>{k.value}<span style={{fontSize:12,fontWeight:300,color:"rgba(255,255,255,0.4)",marginLeft:2}}>{k.unit||""}</span></div>
                  <div style={{fontSize:9,fontWeight:700,color:"rgba(255,255,255,0.4)",textTransform:"uppercase",letterSpacing:".07em",marginTop:5}}>{k.label}</div>
                  {k.sub&&<div style={{fontSize:10,color:"rgba(255,255,255,0.3)",marginTop:3}}>{k.sub}</div>}
                </div>
              ))}
            </div>

            {/* Tableau jours (mission seulement) */}
            {view==="mission"&&dailyRows.length>0&&(
              <div style={{marginBottom:16}}>
                <p style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",letterSpacing:".08em",marginBottom:10}}>📅 Jour par jour (14 derniers jours actifs)</p>
                <div style={{background:"rgba(255,255,255,0.02)",borderRadius:12,border:"1px solid rgba(255,255,255,0.06)",overflow:"hidden"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                    <thead><tr style={{borderBottom:"1px solid rgba(255,255,255,0.07)"}}>
                      {["Date","Adhérents","Don moyen","Adh/h"].map(h=><th key={h} style={{padding:"7px 12px",textAlign:"left",color:"rgba(255,255,255,0.35)",fontWeight:700,fontSize:9,textTransform:"uppercase",letterSpacing:".06em"}}>{h}</th>)}
                    </tr></thead>
                    <tbody>
                      {dailyRows.map((r,i)=>(
                        <tr key={i} style={{borderBottom:"1px solid rgba(255,255,255,0.04)",background:r.isToday?"rgba(124,58,237,.08)":"transparent"}}>
                          <td style={{padding:"7px 12px",color:r.isToday?"#c4b5fd":"rgba(255,255,255,0.7)",fontWeight:r.isToday?700:400}}>{r.date}{r.isToday?" 🟢":""}</td>
                          <td style={{padding:"7px 12px",color:"#a78bfa",fontWeight:700}}>{r.count}</td>
                          <td style={{padding:"7px 12px",color:"#34d399"}}>{r.avgDon!==null?r.avgDon.toFixed(2)+" €":"—"}</td>
                          <td style={{padding:"7px 12px",color:"#fbbf24",fontWeight:600}}>{r.ratio}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {ages.length>0&&(
              <div>
                <p style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",letterSpacing:".08em",marginBottom:10}}>🎂 Tranches d'âge</p>
                <PieChart data={ageTranches} size={130}/>
              </div>
            )}
          </>
        )}
      </div>
    );
  }

  // ── MODALS ────────────────────────────────────────────────────────
  function DetailModal({row,onClose,onDelete}) {
    if (!row) return null;
    return (
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:3000,display:"flex",alignItems:"center",justifyContent:"center",padding:24}} onClick={onClose}>
        <div onClick={e=>e.stopPropagation()} style={{background:"#1a1730",borderRadius:24,padding:32,maxWidth:620,width:"100%",maxHeight:"90vh",overflowY:"auto",border:"1px solid rgba(255,255,255,0.1)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:22}}>
            <div><h2 style={{fontFamily:serif,fontSize:26,color:"white",margin:0}}>{row.prenom} {row.nom}</h2><p style={{color:"rgba(255,255,255,0.4)",fontSize:12,marginTop:3}}>{fmtDate(row.created_at)}</p></div>
            <button onClick={onClose} style={{background:"rgba(255,255,255,0.08)",border:"none",color:"white",width:34,height:34,borderRadius:"50%",cursor:"pointer",fontSize:17}}>✕</button>
          </div>
          {[
            {title:"Coordonnées",fields:[["Nom",`${row.prenom} ${row.nom}`],["Naissance",fmtDate(row.date_naissance)],["Adresse",`${row.adresse??""}, ${row.code_postal??""} ${row.ville??""}`],["Tél",row.telephone],["Email",row.email]]},
            {title:"Don",fields:[["Montant",row.montant_don?`${parseFloat(row.montant_don).toFixed(2)} €`:"—"]]},
            {title:"Bancaire",fields:[["IBAN",row.iban||"—"],["BIC",row.bic||"—"]]},
          ].map(s=>(
            <div key={s.title} style={{marginBottom:10,background:"rgba(255,255,255,0.04)",borderRadius:12,padding:"13px 16px"}}>
              <h3 style={{fontSize:9,fontWeight:700,color:"rgba(255,255,255,0.35)",letterSpacing:".08em",textTransform:"uppercase",marginBottom:8}}>{s.title}</h3>
              {s.fields.map(([l,v])=>(
                <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
                  <span style={{fontSize:12,color:"rgba(255,255,255,0.45)"}}>{l}</span>
                  <span style={{fontSize:12,color:"white",fontWeight:500,maxWidth:"60%",textAlign:"right",wordBreak:"break-all"}}>{v||"—"}</span>
                </div>
              ))}
            </div>
          ))}
          {row.signature&&<div style={{marginBottom:10,background:"rgba(255,255,255,0.04)",borderRadius:12,padding:"13px 16px"}}><h3 style={{fontSize:9,fontWeight:700,color:"rgba(255,255,255,0.35)",letterSpacing:".08em",textTransform:"uppercase",marginBottom:8}}>Signature</h3><img src={row.signature} alt="sig" style={{width:"100%",borderRadius:6,background:"white",padding:3}}/></div>}
          <div style={{display:"flex",gap:10,marginTop:6}}>
            <button onClick={onClose} style={{flex:1,padding:11,borderRadius:11,border:"1px solid rgba(255,255,255,0.12)",background:"transparent",color:"white",cursor:"pointer",fontFamily:font,fontWeight:600}}>Fermer</button>
            <button onClick={()=>onDelete(row)} style={{padding:"11px 20px",borderRadius:11,border:"none",background:"#7f1d1d",color:"#fca5a5",cursor:"pointer",fontFamily:font,fontWeight:700}}>Supprimer</button>
          </div>
        </div>
      </div>
    );
  }

  function ConfirmModal({row,onConfirm,onCancel}) {
    if (!row) return null;
    return (
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.8)",zIndex:4000,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
        <div className="fade-in" style={{background:"#1a1730",borderRadius:20,padding:32,maxWidth:360,width:"100%",textAlign:"center",border:"1px solid rgba(239,68,68,.3)"}}>
          <div style={{fontSize:36,marginBottom:14}}>⚠️</div>
          <h3 style={{fontFamily:serif,fontSize:22,color:"white",marginBottom:8}}>Supprimer ?</h3>
          <p style={{color:"rgba(255,255,255,0.5)",fontSize:13,lineHeight:1.6,marginBottom:24}}>Supprimer définitivement <strong style={{color:"white"}}>{row.prenom} {row.nom}</strong> ? Irréversible.</p>
          <div style={{display:"flex",gap:10}}>
            <button onClick={onCancel} style={{flex:1,padding:13,borderRadius:11,border:"1px solid rgba(255,255,255,0.12)",background:"transparent",color:"white",cursor:"pointer",fontFamily:font,fontWeight:600}}>Annuler</button>
            <button onClick={()=>onConfirm(row.id)} style={{flex:1,padding:13,borderRadius:11,border:"none",background:"#ef4444",color:"white",cursor:"pointer",fontFamily:font,fontWeight:700}}>Supprimer</button>
          </div>
        </div>
      </div>
    );
  }

  // ── LOGIN SUPABASE ────────────────────────────────────────────────
  function Login({onLogin}) {
    const [email,setEmail]=useState("");
    const [pwd,setPwd]=useState("");
    const [err,setErr]=useState(null);
    const [loading,setLoading]=useState(false);

    async function submit() {
      if (!email.trim()||!pwd) { setErr("Remplissez tous les champs."); return; }
      setLoading(true); setErr(null);
      const {data,error}=await sb.auth.signInWithPassword({email:email.trim(),password:pwd});
      if (error) { setErr("Identifiants incorrects."); setLoading(false); return; }
      const {data:col}=await sb.from("collecteurs").select("role").eq("auth_user_id",data.user.id).single();
      if (!col||col.role!=="admin") { await sb.auth.signOut(); setErr("Accès réservé aux administrateurs."); setLoading(false); return; }
      onLogin(data.user);
    }

    return (
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"radial-gradient(ellipse at 60% 40%,rgba(76,29,149,.2),transparent 60%),#0a091a",padding:24}}>
        <div className="fade-in" style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:28,padding:"48px 40px",maxWidth:400,width:"100%",textAlign:"center"}}>
          <img src="icons/icon-384.png" alt="La Graine" style={{width:80,height:80,borderRadius:20,objectFit:"cover",background:"white",padding:6,margin:"0 auto 20px",display:"block"}} onError={e=>{e.target.style.display="none";}}/>
          <h1 style={{fontFamily:serif,fontSize:30,color:"white",marginBottom:4,fontWeight:600}}>Espace Admin</h1>
          <p style={{color:"#7fcf7f",fontSize:11,letterSpacing:".12em",textTransform:"uppercase",fontWeight:600,marginBottom:24}}>La Graine</p>
          {err&&<div style={{background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.3)",borderRadius:12,padding:"10px 14px",marginBottom:18,color:"#f87171",fontSize:13}}>{err}</div>}
          {[{label:"Email",type:"email",val:email,set:setEmail},{label:"Mot de passe",type:"password",val:pwd,set:setPwd}].map(f=>(
            <div key={f.label} style={{textAlign:"left",marginBottom:14}}>
              <label style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.4)",display:"block",marginBottom:5,letterSpacing:".08em",textTransform:"uppercase"}}>{f.label}</label>
              <input type={f.type} value={f.val} onChange={e=>{f.set(e.target.value);setErr(null);}} onKeyDown={e=>e.key==="Enter"&&submit()}
                style={{width:"100%",padding:"12px 15px",borderRadius:12,fontSize:14,fontFamily:font,border:"1px solid rgba(255,255,255,0.12)",background:"rgba(255,255,255,0.05)",color:"white",outline:"none"}}/>
            </div>
          ))}
          <button onClick={submit} disabled={loading} style={{width:"100%",padding:14,borderRadius:13,border:"none",background:"linear-gradient(135deg,#4c1d95,#6d28d9)",color:"white",fontSize:14,fontWeight:700,cursor:loading?"not-allowed":"pointer",fontFamily:font,opacity:loading?0.7:1,marginTop:8}}>
            {loading?"Connexion…":"Accéder →"}
          </button>
          <p style={{marginTop:18,fontSize:12,color:"rgba(255,255,255,0.3)"}}><a href="dashboard.html" style={{color:"#a78bfa",textDecoration:"none"}}>← Espace collecteur</a></p>
        </div>
      </div>
    );
  }

  // ── APP ───────────────────────────────────────────────────────────
  function App() {
    const [user,setUser]=useState(null);
    const [checking,setChecking]=useState(true);
    const [page,setPage]=useState("overview");
    const [adherents,setAdherents]=useState(null);
    const [collecteurs,setCollecteurs]=useState(null);
    const [loading,setLoading]=useState(false);
    const [error,setError]=useState(null);
    const [selected,setSelected]=useState(null);
    const [delConfirm,setDelConfirm]=useState(null);
    const [search,setSearch]=useState("");
    const [sortField,setSortField]=useState("created_at");
    const [sortDir,setSortDir]=useState("desc");
    const [filterDon,setFilterDon]=useState("");
    const [lastRefresh,setLastRefresh]=useState(null);
    const [heuresJour,setHeuresJour]=useState(()=>parseFloat(localStorage.getItem("admin_hj")||"6.25"));

    useEffect(()=>{
      sb.auth.getSession().then(async({data:{session}})=>{
        if (session?.user) {
          const {data:col}=await sb.from("collecteurs").select("role").eq("auth_user_id",session.user.id).single();
          if (col?.role==="admin") setUser(session.user);
        }
        setChecking(false);
      });
    },[]);

    const load=useCallback(async()=>{
      setLoading(true); setError(null);
      try {
        const [adh,col]=await Promise.all([sbFetch("adherents"),sbFetch("collecteurs").catch(()=>[])]);
        setAdherents(adh); setCollecteurs(col); setLastRefresh(new Date());
      } catch(e) { setError(e.message); }
      setLoading(false);
    },[]);

    useEffect(()=>{ if(user) load(); },[user,load]);

    const adherentsComplets=useMemo(()=>adherents?adherents.filter(r=>!r.incomplet):[],[adherents]);
    const adherentsIncomplets=useMemo(()=>adherents?adherents.filter(r=>r.incomplet===true):[],[adherents]);

    const stats=useMemo(()=>{
      const adh=adherentsComplets; if (!adherents) return null;
      const now=new Date(), todayStr=now.toDateString();
      const {mon:wMon,sun:wSun}=getWeekBounds(now);
      const todayA=adh.filter(a=>new Date(a.created_at).toDateString()===todayStr);
      const weekA=adh.filter(a=>{const d=new Date(a.created_at);return d>=wMon&&d<=wSun;});
      const compute=(arr)=>{
        const d=arr.map(r=>parseFloat(r.montant_don)).filter(x=>!isNaN(x)&&x>0);
        const a=arr.map(r=>calcAge(r.date_naissance)).filter(x=>x!==null&&x>0&&x<120);
        return {total:arr.length,avgDon:d.length>0?d.reduce((s,x)=>s+x,0)/d.length:null,totalDons:d.reduce((s,x)=>s+x,0),avgAge:a.length>0?a.reduce((s,x)=>s+x,0)/a.length:null};
      };
      const uniqDays=(arr)=>[...new Set(arr.map(a=>new Date(a.created_at).toDateString()))].length;
      const villeCounts={}; adh.forEach(r=>{if(r.ville)villeCounts[r.ville]=(villeCounts[r.ville]||0)+1;});
      const topVilles=Object.entries(villeCounts).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([label,value])=>({label,value}));
      const daily=Array.from({length:7},(_,i)=>{const d=new Date(now);d.setDate(now.getDate()-(6-i));return{label:d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}),value:adh.filter(r=>new Date(r.created_at).toDateString()===d.toDateString()).length};});
      const tranches=[{label:"10–15€",v:[10,15]},{label:"15–20€",v:[15,20]},{label:"20–25€",v:[20,25]},{label:"25–35€",v:[25,35]},{label:"35–50€",v:[35,50]},{label:"50€+",v:[50,9999]}].map(t=>({label:t.label,value:adh.filter(r=>r.montant_don>=t.v[0]&&r.montant_don<t.v[1]).length}));
      const ageTranches=[{label:"18–25",min:18,max:25,color:"#a78bfa"},{label:"26–35",min:26,max:35,color:"#60a5fa"},{label:"36–45",min:36,max:45,color:"#34d399"},{label:"46–57",min:46,max:57,color:"#fbbf24"},{label:"58–69",min:58,max:69,color:"#fb923c"},{label:"70–99",min:70,max:99,color:"#f472b6"}].map(t=>{const a=adh.map(r=>calcAge(r.date_naissance)).filter(x=>x!==null&&x>0&&x<120);return{...t,value:a.filter(x=>x>=t.min&&x<=t.max).length};});
      const sA=[...adh.map(r=>calcAge(r.date_naissance)).filter(a=>a!==null&&a>0&&a<120)].sort((a,b)=>a-b);
      const medianAge=sA.length>0?(sA.length%2===0?(sA[sA.length/2-1]+sA[sA.length/2])/2:sA[Math.floor(sA.length/2)]):null;
      return {mission:compute(adh),week:compute(weekA),today:compute(todayA),missionDays:uniqDays(adh),weekDays:uniqDays(weekA),topVilles,daily,tranches,ageTranches,medianAge,totalReduction:adh.reduce((s,r)=>s+(parseFloat(r.reduction_fiscale)||0),0)};
    },[adherentsComplets,adherents]);

    const filtered=useMemo(()=>{
      const q=search.toLowerCase();
      return adherentsComplets.filter(r=>{
        const ms=!q||`${r.nom} ${r.prenom} ${r.email} ${r.ville}`.toLowerCase().includes(q);
        const md=!filterDon||(filterDon==="0"&&!r.montant_don)||(filterDon==="1"&&r.montant_don>=10&&r.montant_don<20)||(filterDon==="2"&&r.montant_don>=20&&r.montant_don<35)||(filterDon==="3"&&r.montant_don>=35&&r.montant_don<50)||(filterDon==="4"&&r.montant_don>=50);
        return ms&&md;
      }).sort((a,b)=>{const va=a[sortField]??"",vb=b[sortField]??"";return sortDir==="asc"?(va>vb?1:-1):(va<vb?1:-1);});
    },[adherentsComplets,search,filterDon,sortField,sortDir]);

    async function handleDelete(id) {
      try { await sbDelete("adherents",id); setAdherents(r=>r.filter(x=>x.id!==id)); setDelConfirm(null); setSelected(null); }
      catch { alert("Erreur suppression."); }
    }

    function sortBy(f){if(sortField===f)setSortDir(d=>d==="asc"?"desc":"asc");else{setSortField(f);setSortDir("asc");}}
    const Arrow=({f})=><span style={{opacity:.5}}>{sortField===f?(sortDir==="asc"?" ↑":" ↓"):" ↕"}</span>;

    if (checking) return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#0a091a"}}><div style={{color:"rgba(255,255,255,0.4)",fontSize:14}} className="loading-dot">Vérification…</div></div>;
    if (!user) return <Login onLogin={u=>setUser(u)}/>;

    const navItems=[
      {key:"overview",label:"Vue d'ensemble",icon:"📊"},
      {key:"incomplets",label:`Incomplets${adherents?` (${adherentsIncomplets.length})`:""}`,icon:"📞"},
      {key:"adherents",label:`Adhérents${adherents?` (${adherentsComplets.length})`:""}`,icon:"👥"},
      {key:"collecteurs",label:`Collecteurs${collecteurs?` (${collecteurs.length})`:""}`,icon:"🚶"},
      {key:"stats_indiv",label:"Stats/collecteur",icon:"📈"},
    ];

    return (
      <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>

        <header style={{background:"rgba(255,255,255,0.03)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"0 20px",height:58,display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100,backdropFilter:"blur(12px)"}}>
          <div style={{display:"flex",alignItems:"center",gap:16,minWidth:0}}>
            <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
              <img src="icons/icon-384.png" alt="" style={{width:30,height:30,borderRadius:8,objectFit:"cover",background:"white",padding:2}} onError={e=>{e.target.style.display="none";}}/>
              <span style={{fontFamily:serif,fontSize:18,color:"white",fontWeight:600}}>La Graine</span>
              <span className="badge badge-purple" style={{marginLeft:2}}>Admin</span>
            </div>
            <nav style={{display:"flex",gap:1,overflowX:"auto"}}>
              {navItems.map(n=>(
                <button key={n.key} onClick={()=>setPage(n.key)} className={`nav-link${page===n.key?" active":""}`} style={{background:page===n.key?"rgba(124,58,237,.2)":undefined}}>
                  {n.icon} {n.label}
                </button>
              ))}
            </nav>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
            {lastRefresh&&<span style={{fontSize:10,color:"rgba(255,255,255,0.25)"}}>🕐 {lastRefresh.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</span>}
            <button onClick={load} disabled={loading} style={{padding:"6px 12px",borderRadius:9,border:"1px solid rgba(255,255,255,0.12)",background:"rgba(255,255,255,0.06)",color:"white",cursor:loading?"not-allowed":"pointer",fontFamily:font,fontSize:12,fontWeight:600}}>
              <span style={{display:"inline-block",animation:loading?"spin 1s linear infinite":"none"}}>🔄</span>
            </button>
            <a href="dashboard.html" style={{padding:"6px 12px",borderRadius:9,border:"1px solid rgba(255,255,255,0.1)",background:"transparent",color:"rgba(255,255,255,0.5)",fontFamily:font,fontSize:12,fontWeight:600,textDecoration:"none"}}>← Collecteur</a>
            <button onClick={async()=>{await sb.auth.signOut();setUser(null);}} style={{padding:"6px 12px",borderRadius:9,border:"1px solid rgba(239,68,68,.3)",background:"rgba(239,68,68,.08)",color:"#f87171",cursor:"pointer",fontFamily:font,fontSize:12,fontWeight:600}}>Déconnexion</button>
          </div>
        </header>

        <main style={{flex:1,maxWidth:1280,margin:"0 auto",width:"100%",padding:"26px 18px"}}>

          {error&&<div style={{background:"rgba(239,68,68,.12)",border:"1px solid rgba(239,68,68,.3)",borderRadius:13,padding:"13px 17px",marginBottom:18,color:"#f87171",fontSize:13}}>⚠️ {error}</div>}

          {/* OVERVIEW */}
          {page==="overview"&&(
            <div className="fade-in">
              <div style={{marginBottom:24}}><h1 style={{fontFamily:serif,fontSize:36,color:"white",fontWeight:600,marginBottom:5}}>Vue d'ensemble</h1><p style={{color:"rgba(255,255,255,0.45)",fontSize:13}}>Statistiques globales — mission, semaine, aujourd'hui</p></div>
              {!stats?(
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14}}>{[1,2,3,4].map(i=><div key={i} className="card" style={{height:110}}><div className="skeleton" style={{marginBottom:10}}/><div className="skeleton" style={{width:"55%"}}/></div>)}</div>
              ):(
                <>
                  {/* Mission */}
                  <p style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",letterSpacing:".08em",marginBottom:10}}>🏁 Mission complète</p>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:13,marginBottom:20}}>
                    <KpiCard icon="👥" label="Adhérents actifs" value={stats.mission.total} color="#a78bfa" sub="RIB validé"/>
                    <KpiCard icon="💸" label="Don moyen" value={stats.mission.avgDon!==null?stats.mission.avgDon.toFixed(2):"—"} unit="€" color="#34d399"/>
                    <KpiCard icon="💰" label="Volume mensuel" value={stats.mission.totalDons.toFixed(0)} unit="€" color="#60a5fa" sub={`Réduction: ${stats.totalReduction.toFixed(0)} €`}/>
                    <KpiCard icon="🎂" label="Âge moyen" value={stats.mission.avgAge!==null?stats.mission.avgAge.toFixed(1):"—"} unit="ans" color="#fb923c" sub={`Médiane: ${stats.medianAge!==null?stats.medianAge.toFixed(0):"—"} ans`}/>
                  </div>

                  {/* Semaine + Aujourd'hui */}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:20}}>
                    {[
                      {title:"📆 Cette semaine",bg:"rgba(96,165,250,.05)",border:"rgba(96,165,250,.15)",data:stats.week,days:stats.weekDays,color:"#60a5fa"},
                      {title:"📅 Aujourd'hui",bg:"rgba(167,139,250,.05)",border:"rgba(167,139,250,.15)",data:stats.today,days:stats.today.total>0?1:0,color:"#a78bfa"},
                    ].map(p=>(
                      <div key={p.title} style={{background:p.bg,border:`1px solid ${p.border}`,borderRadius:16,padding:18}}>
                        <p style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.4)",textTransform:"uppercase",letterSpacing:".08em",marginBottom:14}}>{p.title}</p>
                        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
                          {[
                            {icon:"👥",label:"Adhérents",value:p.data.total,c:p.color},
                            {icon:"⏱️",label:"Adh/h",value:p.days>0?(p.data.total/(p.days*heuresJour)).toFixed(2):"0.00",c:"#fbbf24"},
                            {icon:"💸",label:"Don moyen",value:p.data.avgDon!==null?p.data.avgDon.toFixed(2)+"€":"—",c:"#34d399"},
                          ].map(k=>(
                            <div key={k.label} style={{textAlign:"center"}}>
                              <div style={{fontSize:16,marginBottom:5}}>{k.icon}</div>
                              <div style={{fontFamily:serif,fontSize:22,fontWeight:700,color:k.c,lineHeight:1}}>{k.value}</div>
                              <div style={{fontSize:9,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",letterSpacing:".06em",marginTop:3}}>{k.label}</div>
                            </div>
                          ))}
                        </div>
                        <div style={{fontSize:10,color:"rgba(255,255,255,0.3)",marginTop:10,textAlign:"center"}}>{p.days}j × {heuresJour}h = {(p.days*heuresJour).toFixed(2)}h de terrain</div>
                      </div>
                    ))}
                  </div>

                  {/* KPIs opérationnels */}
                  <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:13,marginBottom:20}}>
                    <KpiCard icon="✅" label="Avec IBAN" value={adherentsComplets.filter(r=>r.iban).length} color="#4ade80" sub={`${adherentsComplets.length>0?(adherentsComplets.filter(r=>r.iban).length/adherentsComplets.length*100).toFixed(0):0}% actifs`}/>
                    <KpiCard icon="📞" label="Incomplets" value={adherentsIncomplets.length} color="#fb923c" sub="En attente RIB"/>
                    <KpiCard icon="🚶" label="Collecteurs" value={collecteurs?collecteurs.length:"—"} color="#fbbf24"/>
                    <KpiCard icon="📍" label="Villes" value={Object.keys(adherentsComplets.reduce((v,r)=>{if(r.ville)v[r.ville]=1;return v;},{})).length||"—"} color="#f472b6"/>
                  </div>

                  {/* Charts */}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14,marginBottom:20}}>
                    <div className="card"><p style={{fontSize:12,fontWeight:700,color:"white",marginBottom:14}}>Inscriptions 7 jours</p><MiniBar data={stats.daily} color="#a78bfa"/></div>
                    <div className="card"><p style={{fontSize:12,fontWeight:700,color:"white",marginBottom:14}}>Répartition dons</p><MiniBar data={stats.tranches} color="#34d399"/></div>
                    <div className="card">
                      <p style={{fontSize:12,fontWeight:700,color:"white",marginBottom:12}}>Top 5 villes</p>
                      {stats.topVilles.length===0?<p style={{color:"rgba(255,255,255,0.3)",fontSize:12}}>Aucune donnée</p>:stats.topVilles.map((v,i)=>(
                        <div key={v.label} style={{display:"flex",alignItems:"center",gap:8,marginBottom:7}}>
                          <span style={{fontSize:10,color:"rgba(255,255,255,0.4)",width:14}}>{i+1}.</span>
                          <div style={{flex:1,background:"rgba(255,255,255,0.06)",borderRadius:4,height:5,overflow:"hidden"}}><div style={{width:`${(v.value/stats.topVilles[0].value)*100}%`,height:"100%",background:"#60a5fa",borderRadius:4}}/></div>
                          <span style={{fontSize:11,color:"rgba(255,255,255,0.7)",minWidth:65}}>{v.label}</span>
                          <span className="badge badge-blue">{v.value}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:20}}>
                    <div className="card"><p style={{fontSize:12,fontWeight:700,color:"white",marginBottom:14}}>🎂 Tranches d'âge</p><PieChart data={stats.ageTranches} size={150}/></div>
                    <div className="card" style={{display:"flex",flexDirection:"column",gap:10}}>
                      <p style={{fontSize:12,fontWeight:700,color:"white"}}>⏱️ Heures de terrain / journée</p>
                      <p style={{fontSize:12,color:"rgba(255,255,255,0.4)",lineHeight:1.5}}>Base pour le calcul des ratios adh/h.</p>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <input type="number" value={heuresJour} min="1" max="12" step="0.25"
                          onChange={e=>{const v=parseFloat(e.target.value);if(!isNaN(v)&&v>0){setHeuresJour(v);localStorage.setItem("admin_hj",v);}}}
                          style={{width:74,padding:"8px 12px",borderRadius:10,border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.07)",color:"white",fontFamily:font,fontSize:16,fontWeight:700,textAlign:"center",outline:"none"}}/>
                        <span style={{fontSize:12,color:"rgba(255,255,255,0.35)"}}>heures</span>
                      </div>
                    </div>
                  </div>

                  <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                    <button onClick={()=>setPage("adherents")} style={{padding:"10px 16px",borderRadius:11,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(255,255,255,0.05)",color:"rgba(255,255,255,0.8)",cursor:"pointer",fontFamily:font,fontSize:13,fontWeight:600}}>👥 Adhérents ({adherentsComplets.length})</button>
                    <button onClick={()=>exportCSV(adherentsComplets,"adherents")} style={{padding:"10px 16px",borderRadius:11,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(255,255,255,0.05)",color:"rgba(255,255,255,0.8)",cursor:"pointer",fontFamily:font,fontSize:13,fontWeight:600}}>📥 Exporter CSV</button>
                    {adherentsIncomplets.length>0&&<button onClick={()=>setPage("incomplets")} style={{padding:"10px 16px",borderRadius:11,border:"1px solid rgba(251,146,60,.3)",background:"rgba(251,146,60,.08)",color:"#fb923c",cursor:"pointer",fontFamily:font,fontSize:13,fontWeight:600}}>📞 {adherentsIncomplets.length} incomplet{adherentsIncomplets.length>1?"s":""}</button>}
                  </div>
                </>
              )}
            </div>
          )}

          {/* INCOMPLETS */}
          {page==="incomplets"&&(
            <div className="fade-in">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:22}}>
                <div><h1 style={{fontFamily:serif,fontSize:34,color:"white",fontWeight:600,marginBottom:4}}>📞 Dossiers incomplets</h1><p style={{color:"rgba(255,255,255,0.4)",fontSize:13}}>Prospects en attente de RIB</p></div>
                {adherentsIncomplets.length>0&&<button onClick={()=>exportCSV(adherentsIncomplets,"rappels")} style={{padding:"9px 15px",borderRadius:10,border:"1px solid rgba(255,255,255,0.12)",background:"rgba(255,255,255,0.06)",color:"white",cursor:"pointer",fontFamily:font,fontSize:12,fontWeight:600}}>📥 CSV</button>}
              </div>
              {loading?<div style={{textAlign:"center",padding:60,color:"rgba(255,255,255,0.3)"}} className="loading-dot">Chargement…</div>
              :adherentsIncomplets.length===0?<div className="card" style={{textAlign:"center",padding:60}}><div style={{fontSize:36,marginBottom:14}}>✅</div><p style={{color:"rgba(255,255,255,0.4)"}}>Tout est à jour !</p></div>
              :(
                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  {adherentsIncomplets.map(r=>{
                    const rdv=r.rdv_date?new Date(r.rdv_date):null;
                    const urgent=rdv&&rdv<=new Date();
                    const col=collecteurs?collecteurs.find(c=>c.id===r.collecteur_id):null;
                    return (
                      <div key={r.id} style={{background:urgent?"rgba(239,68,68,.06)":"rgba(255,255,255,0.03)",border:`1px solid ${urgent?"rgba(239,68,68,.25)":"rgba(251,146,60,.2)"}`,borderRadius:15,padding:"17px 20px",display:"grid",gridTemplateColumns:"1fr 1fr 1fr auto",gap:12,alignItems:"center"}}>
                        <div>
                          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:5}}>
                            <div style={{width:32,height:32,borderRadius:9,background:urgent?"rgba(239,68,68,.15)":"rgba(251,146,60,.12)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,flexShrink:0}}>{urgent?"🔴":"📅"}</div>
                            <div><p style={{fontWeight:700,color:"white",fontSize:14}}>{r.prenom} {r.nom}</p><p style={{fontSize:10,color:"rgba(255,255,255,0.35)"}}>{fmtDate(r.created_at)}</p></div>
                          </div>
                          <span style={{fontSize:9,padding:"2px 7px",borderRadius:20,background:"rgba(251,146,60,.15)",color:"#fb923c",fontWeight:700}}>⏳ INCOMPLET</span>
                        </div>
                        <div>
                          <p style={{fontSize:12,color:"rgba(255,255,255,0.7)",marginBottom:2}}>📞 {r.telephone||"—"}</p>
                          <p style={{fontSize:11,color:"rgba(255,255,255,0.4)"}}>📧 {r.email||"—"}</p>
                          {r.montant_don&&<p style={{fontSize:11,color:"#34d399",fontWeight:700,marginTop:2}}>💸 {parseFloat(r.montant_don).toFixed(2)} €/mois</p>}
                        </div>
                        <div>
                          {rdv?<p style={{fontSize:11,fontWeight:700,color:urgent?"#f87171":"#fb923c"}}>{urgent?"⚠️ En retard":"🗓"} {rdv.toLocaleDateString("fr-FR",{weekday:"short",day:"2-digit",month:"short"})}</p>:<p style={{fontSize:11,color:"rgba(255,255,255,0.3)"}}>Pas de RDV fixé</p>}
                          {col&&<p style={{fontSize:10,color:"rgba(255,255,255,0.3)",marginTop:3}}>🚶 {col.prenom} {col.nom}</p>}
                        </div>
                        <div style={{display:"flex",gap:5}}>
                          <button onClick={()=>setSelected(r)} style={{padding:"5px 11px",borderRadius:8,border:"1px solid rgba(255,255,255,0.12)",background:"transparent",color:"white",cursor:"pointer",fontFamily:font,fontSize:11}}>Voir</button>
                          <button onClick={()=>setDelConfirm(r)} style={{padding:"5px 9px",borderRadius:8,border:"none",background:"#7f1d1d",color:"#fca5a5",cursor:"pointer",fontFamily:font,fontSize:11,fontWeight:600}}>✕</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* ADHERENTS */}
          {page==="adherents"&&(
            <div className="fade-in">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:18}}>
                <div><h1 style={{fontFamily:serif,fontSize:34,color:"white",fontWeight:600,marginBottom:4}}>Adhérents</h1><p style={{color:"rgba(255,255,255,0.4)",fontSize:13}}>{filtered.length} sur {adherentsComplets.length}</p></div>
                <div style={{display:"flex",gap:9}}>
                  <button onClick={()=>exportCSV(filtered,"adherents")} style={{padding:"9px 15px",borderRadius:10,border:"1px solid rgba(255,255,255,0.12)",background:"rgba(255,255,255,0.06)",color:"white",cursor:"pointer",fontFamily:font,fontSize:12,fontWeight:600}}>📥 CSV</button>
                  <button onClick={load} style={{padding:"9px 15px",borderRadius:10,border:"none",background:"rgba(255,255,255,0.07)",color:"white",cursor:"pointer",fontFamily:font,fontSize:12,fontWeight:600}}>🔄</button>
                </div>
              </div>
              <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>
                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Rechercher…" style={{flex:"1 1 240px",padding:"9px 13px",borderRadius:10,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(255,255,255,0.05)",color:"white",fontFamily:font,fontSize:13,outline:"none"}}/>
                <select value={filterDon} onChange={e=>setFilterDon(e.target.value)} style={{padding:"9px 13px",borderRadius:10,border:"1px solid rgba(255,255,255,0.1)",background:"#16142a",color:"white",fontFamily:font,fontSize:12,cursor:"pointer",outline:"none"}}>
                  <option value="">Tous les dons</option><option value="0">Sans don</option><option value="1">10–20€</option><option value="2">20–35€</option><option value="3">35–50€</option><option value="4">50€+</option>
                </select>
              </div>
              <div style={{background:"rgba(255,255,255,0.025)",borderRadius:15,border:"1px solid rgba(255,255,255,0.07)",overflow:"hidden"}}>
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                    <thead><tr style={{borderBottom:"1px solid rgba(255,255,255,0.1)"}}>
                      {[["created_at","Date"],["nom","Nom"],["prenom","Prénom"],["email","Email"],["ville","Ville"],["montant_don","Don"]].map(([f,l])=>(
                        <th key={f} onClick={()=>sortBy(f)} className="th">{l}<Arrow f={f}/></th>
                      ))}
                      <th className="th" style={{cursor:"default"}}>Actions</th>
                    </tr></thead>
                    <tbody>
                      {filtered.length===0&&<tr><td colSpan={7} style={{textAlign:"center",color:"rgba(255,255,255,0.3)",padding:50,fontSize:13}}>Aucun résultat</td></tr>}
                      {filtered.map((r,i)=>(
                        <tr key={r.id} className="tr-row" style={{background:i%2===0?"transparent":"rgba(255,255,255,0.015)"}}>
                          <td style={{padding:"10px 13px",color:"rgba(255,255,255,0.45)",whiteSpace:"nowrap"}}>{fmtDate(r.created_at)}</td>
                          <td style={{padding:"10px 13px",color:"white",fontWeight:600}}>{r.nom}</td>
                          <td style={{padding:"10px 13px",color:"rgba(255,255,255,0.8)"}}>{r.prenom}</td>
                          <td style={{padding:"10px 13px",color:"rgba(255,255,255,0.6)",maxWidth:170,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.email}</td>
                          <td style={{padding:"10px 13px",color:"rgba(255,255,255,0.55)"}}>{r.ville}</td>
                          <td style={{padding:"10px 13px"}}>{r.montant_don?<span className="badge badge-green">{parseFloat(r.montant_don).toFixed(2)} €</span>:<span style={{color:"rgba(255,255,255,0.2)"}}>—</span>}</td>
                          <td style={{padding:"10px 13px",whiteSpace:"nowrap"}}>
                            <button onClick={()=>setSelected(r)} style={{marginRight:5,padding:"4px 10px",borderRadius:7,border:"1px solid rgba(255,255,255,0.12)",background:"transparent",color:"white",cursor:"pointer",fontFamily:font,fontSize:11}}>Voir</button>
                            <button onClick={()=>setDelConfirm(r)} style={{padding:"4px 10px",borderRadius:7,border:"none",background:"#7f1d1d",color:"#fca5a5",cursor:"pointer",fontFamily:font,fontSize:11,fontWeight:600}}>Suppr.</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* COLLECTEURS */}
          {page==="collecteurs"&&(
            <div className="fade-in">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:22}}>
                <div><h1 style={{fontFamily:serif,fontSize:34,color:"white",fontWeight:600,marginBottom:4}}>Collecteurs</h1><p style={{color:"rgba(255,255,255,0.4)",fontSize:13}}>{collecteurs?collecteurs.length:"—"} compte{collecteurs&&collecteurs.length!==1?"s":""}</p></div>
                {collecteurs&&collecteurs.length>0&&<button onClick={()=>exportCSV(collecteurs,"collecteurs")} style={{padding:"9px 15px",borderRadius:10,border:"1px solid rgba(255,255,255,0.12)",background:"rgba(255,255,255,0.06)",color:"white",cursor:"pointer",fontFamily:font,fontSize:12,fontWeight:600}}>📥 CSV</button>}
              </div>
              {!collecteurs||collecteurs.length===0?(
                <div className="card" style={{textAlign:"center",padding:60}}>
                  <div style={{fontSize:36,marginBottom:14}}>🚶</div>
                  <p style={{color:"rgba(255,255,255,0.4)",fontSize:14,marginBottom:6}}>Aucun collecteur</p>
                  <a href="register.html" style={{display:"inline-block",marginTop:14,padding:"10px 20px",borderRadius:10,background:"linear-gradient(135deg,#4c1d95,#6d28d9)",color:"white",textDecoration:"none",fontSize:13,fontWeight:700}}>Créer un compte →</a>
                </div>
              ):(
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(270px,1fr))",gap:13}}>
                  {collecteurs.map(c=>(
                    <div key={c.id} className="card">
                      <div style={{display:"flex",alignItems:"center",gap:11,marginBottom:13}}>
                        <div style={{width:40,height:40,borderRadius:12,background:"linear-gradient(135deg,#4c1d95,#6d28d9)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,flexShrink:0}}>{c.role==="admin"?"⚙️":c.role==="responsable"?"👔":"🚶"}</div>
                        <div style={{flex:1,minWidth:0}}>
                          <p style={{fontWeight:700,color:"white",fontSize:14,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{c.prenom} {c.nom}</p>
                          <p style={{color:"rgba(255,255,255,0.4)",fontSize:11,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{c.email}</p>
                        </div>
                      </div>
                      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
                        <span className={`badge ${c.role==="admin"?"badge-purple":c.role==="responsable"?"badge-orange":"badge-blue"}`}>{c.role==="admin"?"Admin":c.role==="responsable"?"Responsable":"Collecteur"}</span>
                        {c.organisation&&<span className="badge" style={{background:"rgba(255,255,255,0.06)",color:"rgba(255,255,255,0.5)",border:"1px solid rgba(255,255,255,0.1)"}}>{c.organisation}</span>}
                      </div>
                      <div style={{paddingTop:10,borderTop:"1px solid rgba(255,255,255,0.06)"}}>
                        <p style={{fontSize:11,color:"rgba(255,255,255,0.3)"}}>Inscrit le {fmtDate(c.created_at)}</p>
                        {adherents&&<p style={{fontSize:12,color:"#a78bfa",fontWeight:700,marginTop:3}}>{adherents.filter(a=>a.collecteur_id===c.id&&!a.incomplet).length} adhérent{adherents.filter(a=>a.collecteur_id===c.id&&!a.incomplet).length!==1?"s":""}</p>}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* STATS PAR COLLECTEUR */}
          {page==="stats_indiv"&&(
            <div className="fade-in">
              <div style={{marginBottom:24}}><h1 style={{fontFamily:serif,fontSize:34,color:"white",fontWeight:600,marginBottom:5}}>📈 Stats par collecteur</h1><p style={{color:"rgba(255,255,255,0.4)",fontSize:13}}>Activité individuelle — aujourd'hui / semaine / mission</p></div>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:22,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:13,padding:"13px 16px"}}>
                <span style={{fontSize:12,color:"rgba(255,255,255,0.5)",fontWeight:600}}>⏱️ Heures/journée :</span>
                <input type="number" value={heuresJour} min="1" max="12" step="0.25"
                  onChange={e=>{const v=parseFloat(e.target.value);if(!isNaN(v)&&v>0){setHeuresJour(v);localStorage.setItem("admin_hj",v);}}}
                  style={{width:70,padding:"7px 11px",borderRadius:9,border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.07)",color:"white",fontFamily:font,fontSize:15,fontWeight:700,textAlign:"center",outline:"none"}}/>
                <span style={{fontSize:11,color:"rgba(255,255,255,0.3)"}}>h — base de calcul adh/h pour tous les collecteurs</span>
              </div>
              {!collecteurs||!adherents?<div style={{textAlign:"center",padding:60,color:"rgba(255,255,255,0.3)"}} className="loading-dot">Chargement…</div>
              :collecteurs.length===0?<div className="card" style={{textAlign:"center",padding:60}}><p style={{color:"rgba(255,255,255,0.4)"}}>Aucun collecteur enregistré</p></div>
              :collecteurs.map(col=><CollecteurCard key={col.id} col={col} adherents={adherents} heuresJour={heuresJour}/>)}
            </div>
          )}

        </main>

        <footer style={{borderTop:"1px solid rgba(255,255,255,0.06)",padding:"11px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:11,color:"rgba(255,255,255,0.2)"}}>Admin — La Graine</span>
          <div style={{display:"flex",gap:14}}>
            <a href="dashboard.html" style={{fontSize:11,color:"rgba(255,255,255,0.3)",textDecoration:"none"}}>Espace collecteur</a>
            <a href="register.html" style={{fontSize:11,color:"rgba(255,255,255,0.3)",textDecoration:"none"}}>Inscription</a>
          </div>
        </footer>

        <DetailModal row={selected} onClose={()=>setSelected(null)} onDelete={row=>{setSelected(null);setDelConfirm(row);}}/>
        <ConfirmModal row={delConfirm} onConfirm={handleDelete} onCancel={()=>setDelConfirm(null)}/>
        <style>{`@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}`}</style>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      const swPath = new URL('sw.js', window.location.href).pathname;
      navigator.serviceWorker.register(swPath, { scope: new URL('./', window.location.href).pathname })
        .then(r=>console.log('[SW] OK',r.scope)).catch(e=>console.warn('[SW]',e));
    }
  </script>
  <script src="pwa.js"></script>
</body>
</html>
