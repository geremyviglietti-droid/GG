<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#1e1b4b"/>
  <title>Espace Collecteur</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0f0e1a;font-family:system-ui,sans-serif;min-height:100vh;color:white;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:48px 44px;max-width:480px;width:100%}
    h1{font-size:32px;font-weight:700;margin-bottom:6px}
    .sub{color:rgba(255,255,255,.45);font-size:14px;margin-bottom:32px}
    .tabs{display:flex;gap:8px;margin-bottom:28px;background:rgba(255,255,255,.05);border-radius:14px;padding:6px}
    .tab{flex:1;padding:10px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:transparent;color:rgba(255,255,255,.5)}
    .tab.active{background:linear-gradient(135deg,#4c1d95,#6d28d9);color:white}
    .group{margin-bottom:18px}
    label{display:block;font-size:11px;font-weight:700;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
    input,select{width:100%;padding:14px 16px;border-radius:12px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:white;font-size:15px;font-family:inherit;outline:none}
    input:focus,select:focus{border-color:#6d28d9}
    select option{background:#1e1b4b}
    .btn{width:100%;padding:15px;border:none;border-radius:14px;background:linear-gradient(135deg,#4c1d95,#6d28d9);color:white;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;font-family:inherit}
    .btn:disabled{opacity:.5}
    .alert{border-radius:12px;padding:14px 16px;font-size:13px;margin-bottom:16px}
    .err{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#f87171}
    .ok{background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.3);color:#4ade80}
    .foot{text-align:center;font-size:13px;color:rgba(255,255,255,.4);margin-top:20px}
    .lnk{color:#a78bfa;text-decoration:none;font-weight:600}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .pw{position:relative}
    .eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:18px;padding:0}
    @media(max-width:480px){.card{padding:32px 20px}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="card">
  <h1>Espace Collecteur</h1>
  <p class="sub">Connectez-vous ou créez votre compte</p>
  <div class="tabs">
    <button class="tab active" id="tl" onclick="show('login')">Se connecter</button>
    <button class="tab" id="tr" onclick="show('register')">Créer un compte</button>
  </div>
  <div id="msg"></div>
  <div id="fl">
    <div class="group"><label>Email</label><input type="email" id="le" placeholder="jean@email.com"/></div>
    <div class="group"><label>Mot de passe</label><div class="pw"><input type="password" id="lp" placeholder="••••••••"/><button class="eye" onclick="tp('lp',this)">👁</button></div></div>
    <button class="btn" id="bl" onclick="login()">Se connecter →</button>
    <p class="foot">Pas de compte ? <a class="lnk" href="#" onclick="show('register');return false">S'inscrire</a></p>
    <p class="foot" style="margin-top:10px"><a href="dashboard.html" style="color:rgba(255,255,255,.25);font-size:12px;text-decoration:none">← Tableau de bord</a></p>
  </div>
  <div id="fr" style="display:none">
    <div class="row">
      <div class="group"><label>Prénom *</label><input type="text" id="rp" placeholder="Jean"/></div>
      <div class="group"><label>Nom *</label><input type="text" id="rn" placeholder="MARTIN"/></div>
    </div>
    <div class="group"><label>Email *</label><input type="email" id="re" placeholder="jean@email.com"/></div>
    <div class="group"><label>Téléphone</label><input type="tel" id="rt" placeholder="06 12 34 56 78"/></div>
    <div class="group"><label>Organisation</label><input type="text" id="ro" placeholder="Nom de l'association"/></div>
    <div class="group"><label>Rôle</label><select id="rr"><option value="collecteur">🚶 Collecteur terrain</option><option value="responsable">👔 Responsable</option><option value="admin">⚙️ Admin</option></select></div>
    <div class="group"><label>Mot de passe *</label><div class="pw"><input type="password" id="rw" placeholder="Min. 6 caractères"/><button class="eye" onclick="tp('rw',this)">👁</button></div></div>
    <div class="group"><label>Confirmer *</label><div class="pw"><input type="password" id="rw2" placeholder="Répétez"/><button class="eye" onclick="tp('rw2',this)">👁</button></div></div>
    <button class="btn" id="br" onclick="register()">Créer mon compte →</button>
    <p class="foot">Déjà un compte ? <a class="lnk" href="#" onclick="show('login');return false">Se connecter</a></p>
  </div>
</div>
<script>
var U="https://couruebftrtlqwffdavz.supabase.co",K="sb_publishable_XKVDlf9Bem837GPgx8RNqw_lgs9Q6zc";
try{if(sessionStorage.getItem("collecteur"))location.href="dashboard.html";}catch(e){}

function show(t){
  document.getElementById('fl').style.display=t==='login'?'block':'none';
  document.getElementById('fr').style.display=t==='register'?'block':'none';
  document.getElementById('tl').className='tab'+(t==='login'?' active':'');
  document.getElementById('tr').className='tab'+(t==='register'?' active':'');
  document.getElementById('msg').innerHTML='';
}
function tp(id,btn){var i=document.getElementById(id);i.type=i.type==='password'?'text':'password';btn.textContent=i.type==='password'?'👁':'🙈';}
function msg(t,c){document.getElementById('msg').innerHTML='<div class="alert '+c+'">'+t+'</div>';}

async function hashPassword(pwd){
  var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pwd));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}

async function login(){
  var e=document.getElementById('le').value.trim(),p=document.getElementById('lp').value;
  if(!e||!p){msg('Remplissez tous les champs.','err');return;}
  var b=document.getElementById('bl');b.disabled=1;b.textContent='Connexion…';
  try{
    var hash=await hashPassword(p);
    var r=await fetch(U+'/rest/v1/collecteurs?email=eq.'+encodeURIComponent(e)+'&password_hash=eq.'+hash+'&select=*',{headers:{apikey:K,Authorization:'Bearer '+K}});
    var u=await r.json();
    if(!u||!u.length){msg('Email ou mot de passe incorrect.','err');return;}
    sessionStorage.setItem('collecteur',JSON.stringify(u[0]));
    msg('✓ Connexion réussie ! Redirection…','ok');
    setTimeout(function(){location.href='dashboard.html';},800);
  }catch(err){msg('Erreur : '+err.message,'err');}
  finally{b.disabled=0;b.textContent='Se connecter →';}
}

async function register(){
  var p=document.getElementById('rp').value.trim(),n=document.getElementById('rn').value.trim(),
      e=document.getElementById('re').value.trim(),t=document.getElementById('rt').value.trim(),
      o=document.getElementById('ro').value.trim(),r=document.getElementById('rr').value,
      w=document.getElementById('rw').value,w2=document.getElementById('rw2').value;
  if(!p||!n||!e||!w){msg('Remplissez les champs obligatoires (*).','err');return;}
  if(!e.includes('@')){msg('Email invalide.','err');return;}
  if(w.length<6){msg('Mot de passe trop court (min. 6 caractères).','err');return;}
  if(w!==w2){msg('Les mots de passe ne correspondent pas.','err');return;}
  var b=document.getElementById('br');b.disabled=1;b.textContent='Création…';
  try{
    var c=await fetch(U+'/rest/v1/collecteurs?email=eq.'+encodeURIComponent(e)+'&select=id',{headers:{apikey:K,Authorization:'Bearer '+K}});
    var ex=await c.json();
    if(ex&&ex.length){msg('Cet email est déjà utilisé.','err');return;}
    var hash=await hashPassword(w);
    var res=await fetch(U+'/rest/v1/collecteurs',{method:'POST',headers:{'Content-Type':'application/json',apikey:K,Authorization:'Bearer '+K,Prefer:'return=representation'},body:JSON.stringify({prenom:p,nom:n,email:e,telephone:t,organisation:o,role:r,password_hash:hash,actif:true})});
    if(!res.ok){msg('Erreur serveur : '+(await res.text()),'err');return;}
    var nu=(await res.json())[0];
    sessionStorage.setItem('collecteur',JSON.stringify(nu));
    msg('✓ Compte créé ! Redirection…','ok');
    setTimeout(function(){location.href='dashboard.html';},1000);
  }catch(err){msg('Erreur : '+err.message,'err');}
  finally{b.disabled=0;b.textContent='Créer mon compte →';}
}

document.addEventListener('keydown',function(e){if(e.key!=='Enter')return;document.getElementById('fl').style.display!=='none'?login():register();});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(){});
</script>
</body>
</html>
